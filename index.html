<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dirt Shirt Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0f0f0f; color: #e8e8e8; font-family: 'DM Mono', monospace; overflow: hidden; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .btn {
      padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer;
      font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
      transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #f97316; color: #000; }
    .btn-primary:hover:not(:disabled) { background: #fb923c; }
    .btn-ghost { background: transparent; color: #aaa; border: 1px solid #333; }
    .btn-ghost:hover:not(:disabled) { border-color: #666; color: #eee; }
    .btn-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.27); }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.13); }
    .btn-type { padding: 5px 0; font-size: 11px; border: none; cursor: pointer; border-radius: 6px; flex: 1; font-family: 'DM Mono', monospace; transition: all 0.15s; }

    .zone-tab {
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px;
      border: 1px solid transparent; transition: all 0.15s; white-space: nowrap;
      text-align: left; background: none; width: 100%; color: #888;
      border-color: #333; font-family: 'DM Mono', monospace;
    }
    .zone-tab:hover { border-color: #555; color: #ccc; }
    .zone-tab.active { background: #f97316 !important; color: #000 !important; border-color: #f97316 !important; }

    .layer-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 6px;
      border-radius: 6px; margin-bottom: 3px; cursor: pointer;
      border: 1px solid transparent; transition: background 0.1s;
    }
    .layer-row:hover { background: rgba(255,255,255,0.04); }
    .layer-row.selected { background: rgba(249,115,22,0.09); border-color: rgba(249,115,22,0.27); }

    .design-card {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 16px; transition: border-color 0.2s;
    }
    .design-card:hover { border-color: #f97316; }

    .shirt-placeholder {
      width: 100%; height: 100%;
      border: 2px dashed #2e2e2e; border-radius: 10px;
      background: #141414;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; user-select: none;
    }
    .shirt-placeholder:hover { border-color: #f97316; background: rgba(249,115,22,0.03); }
    .shirt-placeholder:hover .ph-icon { opacity: 0.55; }
    .shirt-placeholder:hover .ph-label { color: #f97316; }
    .shirt-placeholder:hover .ph-btn { border-color: #f97316; color: #f97316; }

    .ph-icon { font-size: 44px; margin-bottom: 12px; opacity: 0.3; transition: opacity 0.2s; }
    .ph-label { font-size: 13px; font-weight: 500; color: #555; text-align: center; line-height: 1.6; transition: color 0.2s; font-family: 'DM Mono', monospace; }
    .ph-btn {
      margin-top: 10px; padding: 5px 14px; border: 1px solid #333; border-radius: 20px;
      font-size: 11px; color: #444; transition: all 0.2s; font-family: 'DM Mono', monospace;
    }

    .shirt-img-wrap { position: relative; width: 100%; height: 100%; }
    .shirt-replace-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
    }
    .shirt-img-wrap:hover .shirt-replace-overlay { opacity: 1; }

    input[type="range"] { accent-color: #f97316; width: 100%; height: 4px; cursor: pointer; }
    input[type="color"] { cursor: pointer; }

    .canvas-area { position: relative; user-select: none; }
    .resize-handle {
      position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px;
      background: #f97316; border-radius: 2px; cursor: se-resize; z-index: 20;
    }

    .header { background: #141414; border-bottom: 1px solid #222; padding: 11px 24px; display: flex; align-items: center; gap: 14px; height: 53px; flex-shrink: 0; }
    .logo-dirt  { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #f97316; letter-spacing: 3px; }
    .logo-shirt { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #e8e8e8; letter-spacing: 2px; }
    .logo-des   { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #f97316; letter-spacing: 2px; }
    .logo-sub   { color: #444; font-size: 11px; }

    .left-panel  { width: 218px; background: #141414; border-right: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .right-panel { width: 242px; background: #141414; border-left: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .center-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; position: relative; overflow: hidden; }
    .editor-wrap { display: flex; overflow: hidden; }

    .panel-section { padding: 12px; border-bottom: 1px solid #1e1e1e; }
    .panel-label { font-size: 10px; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .scrollable { flex: 1; overflow-y: auto; padding: 12px; }

    .color-swatch { width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 2px solid #2a2a2a; transition: transform 0.1s; }
    .color-swatch:hover { transform: scale(1.1); }

    .zone-badge { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 16px; font-size: 11px; color: #666; white-space: nowrap; z-index: 20; pointer-events: none; }
    .dtf-badge { margin-top: 14px; background: #161616; border: 1px solid rgba(249,115,22,0.2); border-radius: 8px; padding: 8px 20px; display: flex; gap: 16px; align-items: center; }
    .dtf-label { font-size: 10px; color: #f97316; text-transform: uppercase; letter-spacing: 1px; }
    .dtf-value { font-family: 'Bebas Neue', cursive; font-size: 22px; color: #fff; letter-spacing: 1px; }

    .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; }
    .lib-wrap { padding: 32px; max-width: 1100px; margin: 0 auto; overflow-y: auto; height: 100%; }
    .lib-header { display: flex; align-items: center; margin-bottom: 24px; }
    .lib-title { font-family: 'Bebas Neue', cursive; font-size: 28px; color: #f97316; letter-spacing: 1px; margin: 0; }

    .empty-state { text-align: center; color: #555; padding-top: 80px; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    .print-guide { position: absolute; left: 15%; top: 14%; width: 70%; height: 72%; border: 1px dashed rgba(255,255,255,0.07); border-radius: 4px; pointer-events: none; z-index: 2; }
    .art-hint { position: absolute; left: 15%; top: 14%; width: 70%; height: 72%; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }

    .slider-row { margin-bottom: 10px; }
    .slider-top { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .slider-key { font-size: 10px; color: #666; }
    .slider-val { font-size: 10px; color: #999; }

    .name-display { cursor: text; font-weight: 500; font-size: 13px; color: #e8e8e8; display: flex; align-items: center; gap: 6px; }
    .name-input { width: 100%; background: #222; border: 1px solid #f97316; border-radius: 4px; padding: 4px 8px; color: #fff; font-size: 13px; outline: none; font-family: 'DM Mono', monospace; }

    .dtf-box { margin-top: 14px; background: #0f0f0f; border: 1px solid rgba(249,115,22,0.13); border-radius: 8px; padding: 10px; }
    .dtf-box-label { font-size: 10px; color: #f97316; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .dtf-box-val { font-family: 'Bebas Neue', cursive; font-size: 22px; color: #fff; letter-spacing: 1px; }
    .dtf-box-sub { font-size: 10px; color: #555; margin-top: 2px; }

    .dot-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; margin-left: 6px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ─── Data ────────────────────────────────────────────────────────────────────
const SHIRT_COLORS = [
  { name:"White",       hex:"#FFFFFF" }, { name:"Black",      hex:"#1a1a1a" },
  { name:"Navy",        hex:"#1B2A4A" }, { name:"Royal Blue", hex:"#2563EB" },
  { name:"Red",         hex:"#DC2626" }, { name:"Forest",     hex:"#166534" },
  { name:"Charcoal",    hex:"#374151" }, { name:"Maroon",     hex:"#7F1D1D" },
  { name:"Gold",        hex:"#D97706" }, { name:"Purple",     hex:"#7C3AED" },
  { name:"Pink",        hex:"#EC4899" }, { name:"Orange",     hex:"#EA580C" },
  { name:"Teal",        hex:"#0D9488" }, { name:"Gray",       hex:"#9CA3AF" },
  { name:"Tan",         hex:"#D4A574" }, { name:"Lt Blue",    hex:"#93C5FD" },
];

const SHIRT_ZONES = {
  short: [
    { id:"short_front",  label:"Short Sleeve – Front",  maxW:12, maxH:14 },
    { id:"short_back",   label:"Short Sleeve – Back",   maxW:12, maxH:14 },
    { id:"short_sleeve", label:"Short Sleeve – Sleeve", maxW:4,  maxH:4  },
  ],
  long: [
    { id:"long_front",  label:"Long Sleeve – Front",  maxW:12, maxH:14 },
    { id:"long_back",   label:"Long Sleeve – Back",   maxW:12, maxH:14 },
    { id:"long_sleeve", label:"Long Sleeve – Sleeve", maxW:4,  maxH:14 },
  ],
};

const ZONE_SIZE = {
  short_front:[320,380], short_back:[320,380], short_sleeve:[320,210],
  long_front:[320,430],  long_back:[320,430],  long_sleeve:[220,430],
};

const ZONE_LABELS = {
  short_front:"Short Sleeve Front", short_back:"Short Sleeve Back", short_sleeve:"Short Sleeve Sleeve",
  long_front:"Long Sleeve Front",   long_back:"Long Sleeve Back",   long_sleeve:"Long Sleeve Sleeve",
};

function calcDTF(pctW, pctH, maxW, maxH) {
  return { w:((pctW/100)*maxW).toFixed(1), h:((pctH/100)*maxH).toFixed(1) };
}

function blankDesign(name="New Design") {
  return {
    id: Date.now() + Math.random(),
    name,
    shirtColor: "#FFFFFF",
    shirtType: "short",
    activeZone: "short_front",
    shirtImages: { short_front:null, short_back:null, short_sleeve:null, long_front:null, long_back:null, long_sleeve:null },
    zones: { short_front:{layers:[]}, short_back:{layers:[]}, short_sleeve:{layers:[]}, long_front:{layers:[]}, long_back:{layers:[]}, long_sleeve:{layers:[]} },
  };
}

// ─── ShirtBackground ─────────────────────────────────────────────────────────
function ShirtBackground({ zoneId, shirtImage, onUpload }) {
  const fileRef = useRef(null);
  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => onUpload(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value = "";
  }
  return (
    <div style={{position:"absolute",inset:0,zIndex:0}}>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile} />
      {shirtImage ? (
        <div className="shirt-img-wrap">
          <img src={shirtImage} alt="shirt" style={{width:"100%",height:"100%",objectFit:"contain",display:"block"}} draggable={false} />
          <div className="shirt-replace-overlay" onClick={() => fileRef.current.click()}>
            <div style={{fontSize:26}}>🔄</div>
            <div style={{fontSize:11,color:"#fff",marginTop:6}}>Replace Shirt Image</div>
          </div>
        </div>
      ) : (
        <div className="shirt-placeholder" onClick={() => fileRef.current.click()}>
          <div className="ph-icon">👕</div>
          <div className="ph-label">Upload {ZONE_LABELS[zoneId]} Image</div>
          <div className="ph-btn">Click to browse</div>
        </div>
      )}
    </div>
  );
}

// ─── Slider ──────────────────────────────────────────────────────────────────
function Slider({ label, value, min, max, onChange }) {
  return (
    <div className="slider-row">
      <div className="slider-top">
        <span className="slider-key">{label}</span>
        <span className="slider-val">{Math.round(value)}</span>
      </div>
      <input type="range" min={min} max={max} step={label.includes("°")?1:0.5}
        value={value} onChange={e => onChange(parseFloat(e.target.value))} />
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [designs, setDesigns] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [view, setView] = useState("editor");

  function createDesign(name) {
    const d = blankDesign(name || "New Design");
    setDesigns(prev => [d, ...prev]);
    setActiveId(d.id);
    setView("editor");
    return d;
  }

  function saveDesign(updated) {
    setDesigns(prev => prev.map(d => d.id === updated.id ? updated : d));
    setActiveId(updated.id);
  }

  function duplicateDesign(d) {
    const copy = JSON.parse(JSON.stringify(d));
    copy.id = Date.now() + Math.random();
    copy.name = d.name + " (Copy)";
    setDesigns(prev => [copy, ...prev]);
    setActiveId(copy.id);
    setView("editor");
  }

  function deleteDesign(id) {
    setDesigns(prev => prev.filter(d => d.id !== id));
    if (activeId === id) { setActiveId(null); setView("library"); }
  }

  function openDesign(d) { setActiveId(d.id); setView("editor"); }

  useEffect(() => { createDesign("My First Design"); }, []);

  const activeDesign = designs.find(d => d.id === activeId) || null;

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      {/* Header */}
      <div className="header">
        <span className="logo-dirt">DIRT</span>
        <span className="logo-shirt">SHIRT</span>
        <span className="logo-des">DESIGNER</span>
        <span style={{color:"#2a2a2a",fontSize:20,lineHeight:1,margin:"0 4px"}}>|</span>
        <span className="logo-sub">DTF Transfer Studio</span>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          <button className="btn btn-ghost" onClick={() => setView("library")}>📂 My Designs ({designs.length})</button>
          <button className="btn btn-primary" onClick={() => createDesign()}>+ New Design</button>
        </div>
      </div>

      {/* Body */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {view === "library" ? (
          <Library designs={designs} onOpen={openDesign} onDuplicate={duplicateDesign} onDelete={deleteDesign} onNew={() => createDesign()} />
        ) : activeDesign ? (
          <Editor
            key={activeDesign.id}
            design={activeDesign}
            onSave={saveDesign}
            onDuplicate={() => duplicateDesign(activeDesign)}
            onBack={() => setView("library")}
          />
        ) : (
          <div style={{display:"flex",justifyContent:"center",alignItems:"center",flex:1,flexDirection:"column",gap:16}}>
            <p style={{color:"#555"}}>No design selected</p>
            <button className="btn btn-primary" onClick={() => createDesign()}>Create New Design</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Library ─────────────────────────────────────────────────────────────────
function Library({ designs, onOpen, onDuplicate, onDelete, onNew }) {
  return (
    <div className="lib-wrap">
      <div className="lib-header">
        <h2 className="lib-title">MY DESIGNS</h2>
        <button className="btn btn-primary" style={{marginLeft:"auto"}} onClick={onNew}>+ New Design</button>
      </div>
      {designs.length === 0 ? (
        <div className="empty-state">
          <div className="empty-icon">👕</div>
          <p style={{marginBottom:16}}>No designs yet</p>
          <button className="btn btn-primary" onClick={onNew}>Create Your First Design</button>
        </div>
      ) : (
        <div className="lib-grid">
          {designs.map(d => {
            const previewImg = Object.values(d.shirtImages||{}).find(Boolean);
            const totalLayers = Object.values(d.zones||{}).reduce((s,z) => s+(z.layers?.length||0), 0);
            return (
              <div key={d.id} className="design-card">
                <div style={{background:"#111",borderRadius:8,height:130,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12,cursor:"pointer",overflow:"hidden"}}
                  onClick={() => onOpen(d)}>
                  {previewImg
                    ? <img src={previewImg} alt="preview" style={{width:"100%",height:"100%",objectFit:"contain"}} />
                    : <div style={{fontSize:42,opacity:0.18}}>👕</div>}
                </div>
                <div style={{fontWeight:500,fontSize:13,marginBottom:3,color:"#e8e8e8"}}>{d.name}</div>
                <div style={{fontSize:11,color:"#555",marginBottom:10}}>
                  {d.shirtType==="short"?"Short Sleeve":"Long Sleeve"} · {totalLayers} art layer{totalLayers!==1?"s":""}
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn btn-primary" style={{flex:1,padding:"5px 8px",fontSize:11}} onClick={() => onOpen(d)}>Edit</button>
                  <button className="btn btn-ghost" style={{padding:"5px 10px"}} onClick={() => onDuplicate(d)} title="Duplicate">⧉</button>
                  <button className="btn btn-danger" style={{padding:"5px 10px"}} onClick={() => onDelete(d.id)}>✕</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── Editor ──────────────────────────────────────────────────────────────────
function Editor({ design, onSave, onDuplicate, onBack }) {
  const [d, setD] = useState(() => JSON.parse(JSON.stringify(design)));
  const [selectedLayer, setSelectedLayer] = useState(null);
  const [bgRemoving, setBgRemoving] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const [nameVal, setNameVal] = useState(d.name);
  const canvasRef = useRef(null);
  const isDragging = useRef(false);
  const dragStart = useRef({});
  const artFileRef = useRef(null);

  const zone = d.zones[d.activeZone];
  const allZones = [...SHIRT_ZONES.short, ...SHIRT_ZONES.long];
  const zoneInfo = allZones.find(z => z.id === d.activeZone);
  const [cW, cH] = ZONE_SIZE[d.activeZone] || [320,380];
  const hasShirtImg = !!d.shirtImages?.[d.activeZone];
  const selLayer = zone.layers.find(l => l.id === selectedLayer);
  const dtfInfo = selLayer ? calcDTF(selLayer.w, selLayer.h, zoneInfo?.maxW||12, zoneInfo?.maxH||14) : null;

  const upd = useCallback(patch => setD(p => ({...p,...patch})), []);

  const updZone = useCallback((zid, patch) => setD(p => ({...p, zones:{...p.zones,[zid]:{...p.zones[zid],...patch}}})), []);

  const updLayer = useCallback((lid, patch) => {
    setD(p => {
      const layers = p.zones[p.activeZone].layers.map(l => l.id===lid ? {...l,...patch} : l);
      return {...p, zones:{...p.zones,[p.activeZone]:{...p.zones[p.activeZone],layers}}};
    });
  }, []);

  function setShirtImg(zid, src) { setD(p => ({...p, shirtImages:{...p.shirtImages,[zid]:src}})); }

  function addArtLayer(dataUrl) {
    const img = new Image();
    img.onload = () => {
      const asp = img.width/img.height;
      const w=42, h=w/asp;
      const layer = {id:Date.now()+Math.random(),src:dataUrl,x:29,y:22,w,h,opacity:100,rotation:0,locked:false};
      updZone(d.activeZone, {layers:[...zone.layers, layer]});
      setSelectedLayer(layer.id);
    };
    img.src = dataUrl;
  }

  function handleArtFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => addArtLayer(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  async function removeBg() {
    if (!selLayer) return;
    setBgRemoving(true);
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement("canvas");
        cv.width=img.width; cv.height=img.height;
        const ctx=cv.getContext("2d");
        ctx.drawImage(img,0,0);
        const data=ctx.getImageData(0,0,cv.width,cv.height);
        const px=data.data;
        const corners=[[0,0],[cv.width-1,0],[0,cv.height-1],[cv.width-1,cv.height-1]];
        let r=0,g=0,b=0;
        corners.forEach(([x,y])=>{ const i=(y*cv.width+x)*4; r+=px[i];g+=px[i+1];b+=px[i+2]; });
        r=Math.round(r/4); g=Math.round(g/4); b=Math.round(b/4);
        const t=40;
        for(let i=0;i<px.length;i+=4){
          if(Math.abs(px[i]-r)<t&&Math.abs(px[i+1]-g)<t&&Math.abs(px[i+2]-b)<t) px[i+3]=0;
        }
        ctx.putImageData(data,0,0);
        updLayer(selLayer.id, {src:cv.toDataURL("image/png")});
        resolve();
      };
      img.src = selLayer.src;
    });
    setBgRemoving(false);
  }

  function deleteLayer(id) {
    updZone(d.activeZone, {layers:zone.layers.filter(l=>l.id!==id)});
    if (selectedLayer===id) setSelectedLayer(null);
  }

  function reorderLayer(id, dir) {
    const layers=[...zone.layers], idx=layers.findIndex(l=>l.id===id), ni=idx+dir;
    if(ni<0||ni>=layers.length) return;
    [layers[idx],layers[ni]]=[layers[ni],layers[idx]];
    updZone(d.activeZone,{layers});
  }

  function layerAt(cx,cy) {
    for(let i=zone.layers.length-1;i>=0;i--){
      const l=zone.layers[i];
      const lx=(l.x/100)*cW,ly=(l.y/100)*cH,lw=(l.w/100)*cW,lh=(l.h/100)*cH;
      if(cx>=lx&&cx<=lx+lw&&cy>=ly&&cy<=ly+lh) return l;
    }
    return null;
  }

  function onMD(e) {
    const rect=canvasRef.current.getBoundingClientRect();
    const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    const layer=layerAt(cx,cy);
    if(layer&&!layer.locked){
      setSelectedLayer(layer.id);
      isDragging.current=true;
      dragStart.current={cx,cy,ox:layer.x,oy:layer.y};
    } else if(!layer) {
      setSelectedLayer(null);
    }
  }

  function onMM(e) {
    if(!isDragging.current||!selectedLayer) return;
    const rect=canvasRef.current.getBoundingClientRect();
    const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
    const dx=((cx-dragStart.current.cx)/cW)*100;
    const dy=((cy-dragStart.current.cy)/cH)*100;
    updLayer(selectedLayer,{x:Math.max(0,dragStart.current.ox+dx),y:Math.max(0,dragStart.current.oy+dy)});
  }

  function onMU() { isDragging.current=false; }

  async function download(withShirt) {
    const sc=2.5, w=cW*sc, h=cH*sc;
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const ctx=cv.getContext("2d");
    ctx.clearRect(0,0,w,h);
    if(withShirt){
      const src=d.shirtImages?.[d.activeZone];
      if(src){
        await new Promise(res=>{ const img=new Image(); img.onload=()=>{ctx.drawImage(img,0,0,w,h);res();}; img.src=src; });
      } else { ctx.fillStyle=d.shirtColor; ctx.fillRect(0,0,w,h); }
    }
    for(const layer of zone.layers){
      await new Promise(res=>{
        const img=new Image();
        img.onload=()=>{
          ctx.globalAlpha=layer.opacity/100;
          const lx=(layer.x/100)*w,ly=(layer.y/100)*h,lw=(layer.w/100)*w,lh=(layer.h/100)*h;
          ctx.save(); ctx.translate(lx+lw/2,ly+lh/2); ctx.rotate((layer.rotation||0)*Math.PI/180);
          ctx.drawImage(img,-lw/2,-lh/2,lw,lh); ctx.restore(); ctx.globalAlpha=1; res();
        };
        img.src=layer.src;
      });
    }
    const a=document.createElement("a");
    a.href=cv.toDataURL("image/png");
    a.download=`${d.name.replace(/\s+/g,"-")}-${d.activeZone}${withShirt?"-with-shirt":"-logo"}.png`;
    a.click();
  }

  const editorH = "calc(100vh - 53px)";

  return (
    <div style={{display:"flex",height:editorH,overflow:"hidden"}} className="editor-wrap">

      {/* LEFT */}
      <div className="left-panel">
        <div className="panel-section">
          <div className="panel-label">Shirt Type</div>
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            {["short","long"].map(t=>(
              <button key={t} className="btn-type"
                style={{background:d.shirtType===t?"#f97316":"#222",color:d.shirtType===t?"#000":"#888"}}
                onClick={()=>{ upd({shirtType:t,activeZone:t==="short"?"short_front":"long_front"}); setSelectedLayer(null); }}>
                {t==="short"?"Short Sleeve":"Long Sleeve"}
              </button>
            ))}
          </div>
          <div className="panel-label">Zones</div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {SHIRT_ZONES[d.shirtType].map(z=>(
              <button key={z.id} className={`zone-tab${d.activeZone===z.id?" active":""}`}
                onClick={()=>{ upd({activeZone:z.id}); setSelectedLayer(null); }}>
                {z.label.split("–")[1]?.trim()}
                {d.shirtImages?.[z.id]&&<span className="dot-indicator" style={{background:d.activeZone===z.id?"#000":"#f97316"}} />}
              </button>
            ))}
          </div>
        </div>

        <div className="panel-section">
          <div className="panel-label">Shirt Color</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>
            {SHIRT_COLORS.map(c=>(
              <div key={c.hex} title={c.name} className="color-swatch"
                style={{background:c.hex,borderColor:d.shirtColor===c.hex?"#f97316":"#2a2a2a"}}
                onClick={()=>upd({shirtColor:c.hex})} />
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}>
            <span style={{fontSize:10,color:"#555"}}>Custom:</span>
            <input type="color" value={d.shirtColor} onChange={e=>upd({shirtColor:e.target.value})}
              style={{width:32,height:24,border:"1px solid #333",borderRadius:4,background:"none"}} />
          </div>
        </div>

        <div className="scrollable">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span className="panel-label" style={{margin:0}}>Art Layers ({zone.layers.length})</span>
            <button style={{fontSize:10,color:"#f97316",background:"none",border:"none",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}
              onClick={()=>artFileRef.current.click()}>+ Add</button>
          </div>
          {zone.layers.length===0&&(
            <div style={{color:"#3a3a3a",fontSize:11,textAlign:"center",paddingTop:16,lineHeight:1.8}}>
              No art layers yet.<br/>Upload a logo above.
            </div>
          )}
          {[...zone.layers].reverse().map((layer,i)=>(
            <div key={layer.id} className={`layer-row${selectedLayer===layer.id?" selected":""}`}
              onClick={()=>setSelectedLayer(layer.id===selectedLayer?null:layer.id)}>
              <div style={{width:28,height:28,borderRadius:4,overflow:"hidden",flexShrink:0,background:"#222"}}>
                <img src={layer.src} style={{width:"100%",height:"100%",objectFit:"cover"}} alt="" />
              </div>
              <span style={{fontSize:11,flex:1,color:"#ccc",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {layer.locked?"🔒 ":""}Layer {zone.layers.length-i}
              </span>
              <button style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:13,padding:0,lineHeight:1}}
                onClick={e=>{e.stopPropagation();deleteLayer(layer.id);}}>✕</button>
            </div>
          ))}
        </div>
      </div>

      {/* CENTER */}
      <div className="center-area">
        <div className="zone-badge">{zoneInfo?.label} · max print {zoneInfo?.maxW}" × {zoneInfo?.maxH}"</div>

        <div ref={canvasRef} className="canvas-area"
          style={{position:"relative",width:cW,height:cH,borderRadius:10,overflow:"hidden",
            boxShadow:"0 0 0 1px #1e1e1e, 0 30px 80px rgba(0,0,0,0.56)",
            cursor:zone.layers.length>0&&hasShirtImg?"crosshair":"default"}}
          onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}>

          <ShirtBackground zoneId={d.activeZone} shirtImage={d.shirtImages?.[d.activeZone]} onUpload={src=>setShirtImg(d.activeZone,src)} />

          {hasShirtImg&&<div className="print-guide" />}

          {zone.layers.map(layer=>{
            const lx=(layer.x/100)*cW,ly=(layer.y/100)*cH,lw=(layer.w/100)*cW,lh=(layer.h/100)*cH;
            const isSel=layer.id===selectedLayer;
            return (
              <div key={layer.id} style={{position:"absolute",left:lx,top:ly,width:lw,height:lh,zIndex:10,
                opacity:layer.opacity/100,transform:`rotate(${layer.rotation||0}deg)`,transformOrigin:"center center",
                outline:isSel?"2px solid #f97316":"none",cursor:layer.locked?"not-allowed":"move"}}>
                <img src={layer.src} style={{width:"100%",height:"100%",objectFit:"contain",display:"block",pointerEvents:"none"}} alt="" draggable={false} />
                {isSel&&(
                  <div className="resize-handle"
                    onMouseDown={e=>{
                      e.stopPropagation();
                      const sx=e.clientX,sy=e.clientY,sw=layer.w,sh=layer.h;
                      const mv=ev=>updLayer(layer.id,{w:Math.max(5,sw+((ev.clientX-sx)/cW)*100),h:Math.max(5,sh+((ev.clientY-sy)/cH)*100)});
                      const up=()=>{window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);};
                      window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up);
                    }} />
                )}
              </div>
            );
          })}

          {hasShirtImg&&zone.layers.length===0&&(
            <div className="art-hint">
              <div style={{fontSize:22,opacity:0.25,marginBottom:6}}>🎨</div>
              <div style={{color:"rgba(255,255,255,0.1)",fontSize:11,textAlign:"center"}}>Add art layer →</div>
            </div>
          )}
        </div>

        {dtfInfo&&selLayer&&(
          <div className="dtf-badge">
            <span className="dtf-label">DTF Transfer Size</span>
            <span className="dtf-value">{dtfInfo.w}" × {dtfInfo.h}"</span>
          </div>
        )}
      </div>

      {/* RIGHT */}
      <div className="right-panel">
        <div className="panel-section">
          {editingName ? (
            <input className="name-input" autoFocus value={nameVal}
              onChange={e=>setNameVal(e.target.value)}
              onBlur={()=>{upd({name:nameVal});setEditingName(false);}}
              onKeyDown={e=>e.key==="Enter"&&(upd({name:nameVal}),setEditingName(false))} />
          ) : (
            <div className="name-display" onClick={()=>setEditingName(true)}>
              {d.name} <span style={{color:"#444",fontSize:11}}>✏️</span>
            </div>
          )}
          <div style={{display:"flex",gap:6,marginTop:8}}>
            <button className="btn btn-primary" style={{flex:1,fontSize:10,padding:"6px 0"}} onClick={()=>onSave(d)}>💾 Save</button>
            <button className="btn btn-ghost" style={{fontSize:10,padding:"6px 8px"}} onClick={onDuplicate} title="Duplicate">⧉</button>
            <button className="btn btn-ghost" style={{fontSize:10,padding:"6px 8px"}} onClick={onBack}>← Back</button>
          </div>
        </div>

        <div className="panel-section">
          <div className="panel-label">Upload Art / Logo</div>
          <input ref={artFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleArtFile} />
          <button className="btn btn-primary" style={{width:"100%",padding:"9px 0",fontSize:12}}
            onClick={()=>artFileRef.current.click()}>
            🎨 Add Art to {zoneInfo?.label.split("–")[1]?.trim()}
          </button>
        </div>

        {selLayer ? (
          <div className="scrollable">
            <div className="panel-label">Layer Properties</div>
            <button className="btn btn-ghost" style={{width:"100%",marginBottom:10,fontSize:11,padding:"7px 0",borderColor:bgRemoving?"#f97316":"#333"}}
              onClick={removeBg} disabled={bgRemoving}>
              {bgRemoving?"⏳ Removing...":"✂️ Remove Background"}
            </button>
            <Slider label="Width %"    value={selLayer.w}           min={5}   max={100} onChange={v=>updLayer(selLayer.id,{w:v})} />
            <Slider label="Height %"   value={selLayer.h}           min={5}   max={100} onChange={v=>updLayer(selLayer.id,{h:v})} />
            <Slider label="X Position" value={selLayer.x}           min={0}   max={90}  onChange={v=>updLayer(selLayer.id,{x:v})} />
            <Slider label="Y Position" value={selLayer.y}           min={0}   max={90}  onChange={v=>updLayer(selLayer.id,{y:v})} />
            <Slider label="Opacity"    value={selLayer.opacity}     min={0}   max={100} onChange={v=>updLayer(selLayer.id,{opacity:v})} />
            <Slider label="Rotation °" value={selLayer.rotation||0} min={-180} max={180} onChange={v=>updLayer(selLayer.id,{rotation:v})} />
            <div style={{marginTop:10,display:"flex",gap:5,flexWrap:"wrap"}}>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>reorderLayer(selLayer.id,-1)}>⬆ Fwd</button>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>reorderLayer(selLayer.id,1)}>⬇ Back</button>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>updLayer(selLayer.id,{locked:!selLayer.locked})}>
                {selLayer.locked?"🔓":"🔒"}
              </button>
              <button className="btn btn-danger" style={{fontSize:10,flex:1}} onClick={()=>deleteLayer(selLayer.id)}>🗑</button>
            </div>
            {dtfInfo&&(
              <div className="dtf-box">
                <div className="dtf-box-label">DTF Transfer Size</div>
                <div className="dtf-box-val">{dtfInfo.w}" × {dtfInfo.h}"</div>
                <div className="dtf-box-sub">relative to {zoneInfo?.maxW}"×{zoneInfo?.maxH}" max area</div>
              </div>
            )}
          </div>
        ) : (
          <div style={{flex:1,padding:12}}>
            <div style={{fontSize:10,color:"#3a3a3a",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>No Layer Selected</div>
            <div style={{fontSize:11,color:"#333",lineHeight:1.8}}>
              {!hasShirtImg
                ? "Start by clicking the shirt canvas to upload your shirt image for this zone."
                : "Upload art using the button above, then click a layer to edit it."}
            </div>
          </div>
        )}

        <div style={{padding:12,borderTop:"1px solid #1e1e1e",display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
          <div className="panel-label" style={{marginBottom:2}}>Download · {zoneInfo?.label.split("–")[1]?.trim()}</div>
          <button className="btn btn-primary" style={{fontSize:11}} onClick={()=>download(true)}>⬇ Design + Shirt</button>
          <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>download(false)}>⬇ Logo Only (PNG)</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
