<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dirt Shirt Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0f0f0f; color: #e8e8e8; font-family: 'DM Mono', monospace; overflow: hidden; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .btn { padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #f97316; color: #000; }
    .btn-primary:hover:not(:disabled) { background: #fb923c; }
    .btn-ghost { background: transparent; color: #aaa; border: 1px solid #333; }
    .btn-ghost:hover:not(:disabled) { border-color: #666; color: #eee; }
    .btn-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.27); }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.13); }
    .btn-type { padding: 5px 0; font-size: 11px; border: none; cursor: pointer; border-radius: 6px; flex: 1; font-family: 'DM Mono', monospace; transition: all 0.15s; }
    .zone-tab { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; border: 1px solid transparent; transition: all 0.15s; white-space: nowrap; text-align: left; background: none; width: 100%; color: #888; border-color: #333; font-family: 'DM Mono', monospace; }
    .zone-tab:hover { border-color: #555; color: #ccc; }
    .zone-tab.active { background: #f97316 !important; color: #000 !important; border-color: #f97316 !important; }
    .layer-row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; margin-bottom: 3px; cursor: pointer; border: 1px solid transparent; transition: background 0.1s; }
    .layer-row:hover { background: rgba(255,255,255,0.04); }
    .layer-row.selected { background: rgba(249,115,22,0.09); border-color: rgba(249,115,22,0.27); }
    .design-card { background: #141414; border: 1px solid #222; border-radius: 10px; overflow: hidden; transition: all 0.18s; cursor:pointer; }
    .design-card:hover { border-color: #f97316; transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .design-card-thumb { width:100%; aspect-ratio:3/4; background:#0d0d0d; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
    .design-card-thumb img { width:100%; height:100%; object-fit:contain; }
    .design-card-info { padding: 8px 10px 10px; }
    .shirt-stage { position: relative; width: 420px; height: 520px; border-radius: 10px; overflow: visible; background: transparent; box-shadow: 0 0 0 1px #1e1e1e, 0 30px 80px rgba(0,0,0,0.56); }
    .shirt-clip { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; pointer-events: none; z-index: 0; }
    .shirt-bg { position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; background: transparent; border-radius: 10px; overflow: hidden; }
    .shirt-bg img { width: 100%; height: 100%; object-fit: contain; object-position: center center; display: block; transition: opacity 0.18s ease; }
    .bge-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:200; display:flex; flex-direction:column; }
    .bge-toolbar { background:#141414; border-bottom:1px solid #222; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; flex-wrap:wrap; }
    .bge-canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; cursor:none; }
    .bge-footer { background:#141414; border-top:1px solid #222; padding:10px 16px; display:flex; align-items:center; gap:10px; justify-content:flex-end; }
    .bge-cursor { position:fixed; pointer-events:none; border-radius:50%; border:2px solid rgba(255,255,255,0.8); transform:translate(-50%,-50%); z-index:9999; }
    input[type="range"] { accent-color: #f97316; width: 100%; height: 4px; cursor: pointer; }
    input[type="color"] { cursor: pointer; }
    .resize-handle { position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; background: #ef4444; border-radius: 2px; cursor: se-resize; z-index: 20; }
    .header { background: #141414; border-bottom: 1px solid #222; padding: 11px 24px; display: flex; align-items: center; gap: 14px; height: 53px; flex-shrink: 0; }
    .logo-dirt  { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #f97316; letter-spacing: 3px; }
    .logo-shirt { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #e8e8e8; letter-spacing: 2px; }
    .logo-des   { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #f97316; letter-spacing: 2px; }
    .logo-sub   { color: #444; font-size: 11px; }
    .left-panel  { width: 218px; background: #141414; border-right: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .right-panel { width: 242px; background: #141414; border-left: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .center-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; position: relative; overflow: hidden; }
    .editor-wrap { display: flex; overflow: hidden; }
    .panel-section { padding: 12px; border-bottom: 1px solid #1e1e1e; }
    .panel-label { font-size: 10px; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .scrollable { flex: 1; overflow-y: auto; padding: 12px; }
    .color-swatch { width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 2px solid #2a2a2a; transition: transform 0.1s; }
    .color-swatch:hover { transform: scale(1.1); }
    .zone-badge { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 16px; font-size: 11px; color: #666; white-space: nowrap; z-index: 20; pointer-events: none; }
    .dtf-badge { margin-top: 14px; background: #161616; border: 1px solid rgba(249,115,22,0.2); border-radius: 8px; padding: 8px 20px; display: flex; gap: 16px; align-items: center; }
    .dtf-label { font-size: 10px; color: #f97316; text-transform: uppercase; letter-spacing: 1px; }
    .dtf-value { font-family: 'Bebas Neue', cursive; font-size: 22px; color: #fff; letter-spacing: 1px; }
    .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; width: 100%; }
    .lib-wrap { padding: 20px 24px; overflow-y: auto; height: 100%; width: 100%; box-sizing: border-box; }
    .lib-header { display: flex; align-items: center; margin-bottom: 16px; }
    .lib-title { font-family: 'Bebas Neue', cursive; font-size: 28px; color: #f97316; letter-spacing: 1px; margin: 0; }

    .slider-key { font-size: 10px; color: #666; }
    .slider-val { font-size: 10px; color: #999; }
    .name-display { cursor: text; font-weight: 500; font-size: 13px; color: #e8e8e8; display: flex; align-items: center; gap: 6px; }
    .name-input { width: 100%; background: #222; border: 1px solid #f97316; border-radius: 4px; padding: 4px 8px; color: #fff; font-size: 13px; outline: none; font-family: 'DM Mono', monospace; }
    .dtf-box { margin-top: 14px; background: #0f0f0f; border: 1px solid rgba(249,115,22,0.13); border-radius: 8px; padding: 10px; }

    .dot-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; margin-left: 6px; }

    /* ── AI Background Removal Progress UI ── */
    .ai-bg-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:500; display:flex; align-items:center; justify-content:center; }
    .ai-bg-modal { background:#161616; border:1px solid #2a2a2a; border-radius:16px; width:min(520px,94vw); overflow:hidden; box-shadow:0 40px 120px rgba(0,0,0,0.8); }
    .ai-bg-modal-header { background:#111; border-bottom:1px solid #222; padding:16px 20px; display:flex; align-items:center; gap:10px; }
    .ai-bg-modal-body { padding:24px 20px; display:flex; flex-direction:column; gap:16px; align-items:center; }
    .ai-bg-preview-pair { display:flex; gap:12px; width:100%; }
    .ai-bg-preview-box { flex:1; border-radius:10px; overflow:hidden; border:1px solid #2a2a2a; background: repeating-conic-gradient(#1a1a1a 0% 25%, #141414 0% 50%) 0 0/16px 16px; position:relative; min-height:180px; display:flex; align-items:center; justify-content:center; }
    .ai-bg-preview-box img { max-width:100%; max-height:220px; display:block; object-fit:contain; }
    .ai-bg-preview-label { font-size:9px; color:#444; text-transform:uppercase; letter-spacing:1px; text-align:center; margin-top:5px; }
    .ai-progress-bar-wrap { width:100%; background:#111; border-radius:8px; height:6px; overflow:hidden; border:1px solid #1e1e1e; }
    .ai-progress-bar { height:100%; background:linear-gradient(90deg,#f97316,#fb923c); border-radius:8px; transition:width 0.3s ease; }
    .ai-status-text { font-size:11px; color:#888; font-family:'DM Mono',monospace; text-align:center; min-height:18px; }
    .ai-spinner-ring { width:36px; height:36px; border:3px solid #222; border-top-color:#f97316; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── threshold slider UI ── */
    .threshold-pill { display:inline-flex; align-items:center; gap:6px; background:#111; border:1px solid #2a2a2a; border-radius:20px; padding:3px 10px; font-size:10px; color:#666; }

    /* ── Drawing Modal ── */
    .draw-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .draw-modal { background:#161616; border:1px solid #2a2a2a; border-radius:14px; display:flex; flex-direction:column; overflow:hidden; width:min(1100px,98vw); height:min(760px,94vh); box-shadow:0 40px 120px rgba(0,0,0,0.8); }
    .draw-toolbar { background:#111; border-bottom:1px solid #222; padding:7px 12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; flex-shrink:0; }
    .draw-tool-btn { padding:5px 9px; border-radius:6px; border:1px solid #333; background:transparent; color:#888; cursor:pointer; font-size:11px; font-family:'DM Mono',monospace; transition:all 0.15s; white-space:nowrap; }

    .draw-tool-btn.active { background:#f97316; color:#000; border-color:#f97316; }
    .draw-body { flex:1; display:flex; overflow:hidden; min-height:0; }
    .draw-canvas-wrap { flex:1; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#0d0d0d; position:relative; }
    .draw-canvas { display:block; touch-action:none; }
    .draw-footer { background:#111; border-top:1px solid #222; padding:9px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0; justify-content:flex-end; }
    .draw-sidebar { width:200px; background:#0f0f0f; border-left:1px solid #1e1e1e; display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
    .draw-sidebar-header { padding:8px 10px; font-size:10px; color:#555; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #1a1a1a; display:flex; align-items:center; justify-content:space-between; }
    .draw-layer-item { display:flex; align-items:center; gap:7px; padding:5px 8px; cursor:pointer; border-bottom:1px solid #111; transition:background 0.12s; border-left:3px solid transparent; }
    .draw-layer-item:hover { background:rgba(255,255,255,0.04); }
    .draw-layer-item.selected { background:rgba(249,115,22,0.08); border-left-color:#f97316; }
    .draw-layer-thumb { width:32px; height:32px; border-radius:4px; object-fit:contain; background:#1a1a1a; flex-shrink:0; border:1px solid #2a2a2a; }
    .draw-layer-label { font-size:10px; color:#aaa; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .draw-layer-del { background:none; border:none; color:#444; cursor:pointer; font-size:13px; padding:2px; line-height:1; flex-shrink:0; }
    .draw-layer-del:hover { color:#ef4444; }
    .draw-layer-vis { background:none; border:none; color:#555; cursor:pointer; font-size:11px; padding:2px; line-height:1; flex-shrink:0; }
    .draw-layer-vis:hover { color:#ccc; }
    .draw-props { width:180px; background:#0f0f0f; border-left:1px solid #1e1e1e; display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto; }
    .draw-props-section { padding:10px; border-bottom:1px solid #1a1a1a; }
    .draw-props-label { font-size:9px; color:#444; text-transform:uppercase; letter-spacing:1px; margin-bottom:7px; }
    .arrange-btn { flex:1; padding:5px 4px; font-size:10px; background:#1a1a1a; border:1px solid #2a2a2a; color:#888; border-radius:5px; cursor:pointer; font-family:'DM Mono',monospace; transition:all 0.12s; }
    .arrange-btn:hover { border-color:#555; color:#ccc; }
    .ai-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:flex; align-items:center; justify-content:center; }
    .ai-modal { background:#161616; border:1px solid #2a2a2a; border-radius:14px; width:min(680px,94vw); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 40px 120px rgba(0,0,0,0.8); }
    .ai-modal-header { background:#111; border-bottom:1px solid #222; padding:14px 18px; display:flex; align-items:center; gap:10px; }
    .ai-modal-body { padding:20px 18px; display:flex; flex-direction:column; gap:14px; }
    .ai-prompt-row { display:flex; gap:8px; }
    .ai-prompt-input { flex:1; background:#111; border:1px solid #333; border-radius:8px; padding:10px 14px; color:#e8e8e8; font-family:'DM Mono',monospace; font-size:13px; outline:none; resize:none; }
    .ai-prompt-input:focus { border-color:#f97316; }
    .ai-preview-area { background:#0d0d0d; border:1px solid #1e1e1e; border-radius:10px; min-height:320px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
    .ai-preview-img { max-width:100%; max-height:360px; display:block; border-radius:8px; }
    .ai-spinner { width:40px; height:40px; border:3px solid #222; border-top-color:#f97316; border-radius:50%; animation:spin 0.8s linear infinite; }
    .ai-style-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .ai-chip { padding:4px 10px; border-radius:20px; border:1px solid #333; background:transparent; color:#888; font-size:11px; cursor:pointer; font-family:'DM Mono',monospace; transition:all 0.15s; }
    .ai-chip:hover { border-color:#f97316; color:#f97316; }
    .ai-chip.active { background:#f97316; color:#000; border-color:#f97316; }
    [data-tip] { position:relative; }
    [data-tip]:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#222; border:1px solid #333; color:#ccc; font-size:10px; padding:3px 7px; border-radius:4px; white-space:nowrap; pointer-events:none; z-index:999; font-family:'DM Mono',monospace; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

// ═══════════════════════════════════════════════════════════════════════════════
// SHIRT IMAGE PATHS
// ═══════════════════════════════════════════════════════════════════════════════
const SHIRT_IMAGE_SRCS = {
  short_front:  "front_shortsleeve.png",
  short_back:   "back_shortsleeve.png",
  short_sleeve: "side_shortsleeve.png",
  long_front:   "back_longsleeve (1).png",
  long_back:    "back_longsleeve.png",
  long_sleeve:  "side_longsleeve.png",
};
const ZONE_BASE_COLOR = {
  short_front:"#d3783c", short_back:"#d3783c", short_sleeve:"#d3783c",
  long_front:"#ffffff",  long_back:"#ffffff",   long_sleeve:"#ffffff",
};
const ZONE_OFFSET = {
  short_front:  { x: 0, y: 0, s: 1.0 },
  short_back:   { x: 0, y: 0, s: 1.0 },
  short_sleeve: { x: 0, y: 0, s: 1.0 },
  long_front:   { x: 0, y: 0, s: 1.0 },
  long_back:    { x: 0, y: 0, s: 1.0 },
  long_sleeve:  { x: 0, y: 0, s: 1.0 },
};
const STAGE_W = 420, STAGE_H = 520;
const ZONE_LOGICAL = {
  short_front:[380,460], short_back:[380,460], short_sleeve:[380,240],
  long_front:[380,510],  long_back:[380,510],  long_sleeve:[250,510],
};
const SHIRT_COLORS = [
  {name:"Dirt Orange",hex:"#d3783c"},{name:"White",hex:"#FFFFFF"},{name:"Black",hex:"#1a1a1a"},{name:"Navy",hex:"#1B2A4A"},
  {name:"Royal Blue",hex:"#2563EB"},{name:"Red",hex:"#DC2626"},{name:"Forest",hex:"#166534"},
  {name:"Charcoal",hex:"#374151"},{name:"Maroon",hex:"#7F1D1D"},{name:"Gold",hex:"#D97706"},
  {name:"Purple",hex:"#7C3AED"},{name:"Pink",hex:"#EC4899"},{name:"Orange",hex:"#EA580C"},
  {name:"Teal",hex:"#0D9488"},{name:"Gray",hex:"#9CA3AF"},{name:"Tan",hex:"#D4A574"},{name:"Lt Blue",hex:"#93C5FD"},
];
const SIZE_SPECS = {
  S:   { maxW:11,   maxH:17,   collarGap:1.5, bottomGap:4 },
  M:   { maxW:11.5, maxH:17.5, collarGap:2,   bottomGap:4 },
  L:   { maxW:12,   maxH:18,   collarGap:3,   bottomGap:4 },
  XL:  { maxW:12.5, maxH:18.5, collarGap:3,   bottomGap:4 },
  XXL: { maxW:13,   maxH:19,   collarGap:3,   bottomGap:4 },
};
const SHIRT_SIZES = ["S","M","L","XL","XXL"];

const SHIRT_ZONES = {
  short:[
    {id:"short_front",label:"Short Sleeve – Front",maxW:12,maxH:14},
    {id:"short_back",label:"Short Sleeve – Back",maxW:12,maxH:14},
    {id:"short_sleeve",label:"Short Sleeve – Sleeve",maxW:4,maxH:4},
  ],
  long:[
    {id:"long_front",label:"Long Sleeve – Front",maxW:12,maxH:14},
    {id:"long_back",label:"Long Sleeve – Back",maxW:12,maxH:14},
    {id:"long_sleeve",label:"Long Sleeve – Sleeve",maxW:4,maxH:14},
  ],
};
const ZONE_LABELS = {
  short_front:"Short Sleeve Front",short_back:"Short Sleeve Back",short_sleeve:"Short Sleeve Sleeve",
  long_front:"Long Sleeve Front",long_back:"Long Sleeve Back",long_sleeve:"Long Sleeve Sleeve",
};

function calcDTF(pctW,pctH,maxW,maxH){return{w:((pctW/100)*maxW).toFixed(1),h:((pctH/100)*maxH).toFixed(1)};}
function hexToRgb(hex){const h=hex.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function blankDesign(name="New Design"){
  function srcOrNull(key){const s=SHIRT_IMAGE_SRCS[key];return(s&&s!=="#")?s:null;}
  return{
    id:Date.now()+Math.random(),name,shirtColor:"#d3783c",shirtSize:"M",shirtType:"short",activeZone:"short_front",
    shirtImages:{short_front:srcOrNull("short_front"),short_back:srcOrNull("short_back"),short_sleeve:srcOrNull("short_sleeve"),long_front:srcOrNull("long_front"),long_back:srcOrNull("long_back"),long_sleeve:srcOrNull("long_sleeve")},
    zones:{short_front:{layers:[]},short_back:{layers:[]},short_sleeve:{layers:[]},long_front:{layers:[]},long_back:{layers:[]},long_sleeve:{layers:[]}},
  };
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── AI Background Removal Engine
// ═══════════════════════════════════════════════════════════════════════════════
let bgRemovalLib = null;
let bgRemovalLibLoading = false;
let bgRemovalLibCallbacks = [];

async function loadBgRemovalLib() {
  if (bgRemovalLib) return bgRemovalLib;
  if (bgRemovalLibLoading) {
    return new Promise((resolve) => bgRemovalLibCallbacks.push(resolve));
  }
  bgRemovalLibLoading = true;
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/background-removal.js');
    bgRemovalLib = mod.default || mod;
    bgRemovalLibCallbacks.forEach(cb => cb(bgRemovalLib));
    bgRemovalLibCallbacks = [];
    return bgRemovalLib;
  } catch (e) {
    bgRemovalLibLoading = false;

function dataUrlToBlob(dataUrl) {
  const arr = dataUrl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function removeBackgroundAI(dataUrl, onProgress) {
  const lib = await loadBgRemovalLib();
  if (!lib) throw new Error('WASM library unavailable');
  const blob = dataUrlToBlob(dataUrl);
  const config = {
    progress: (key, current, total) => {
      if (onProgress && total > 0) {
        onProgress(Math.round((current / total) * 100), key);
      }
    },
    model: 'isnet_fp16',
    output: { format: 'image/png', quality: 1 },
  };
  const resultBlob = await lib.removeBackground(blob, config);
  return blobToDataUrl(resultBlob);
}

async function removeBackgroundFallback(dataUrl, onProgress) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {

        const W = img.width, H = img.height, N = W * H;
        const cv = document.createElement('canvas');

        const px = imageData.data;
        onProgress && onProgress(30, 'sampling');

        for (let i = 0; i < edgeSamples; i++) {
          const t = i / (edgeSamples - 1);

          samplePoints.push([Math.floor(t * (W-1)), H-1]);
          samplePoints.push([0, Math.floor(t * (H-1))]);
          samplePoints.push([W-1, Math.floor(t * (H-1))]);
        }
        let bgR=0, bgG=0, bgB=0;
        samplePoints.forEach(([x,y]) => {
          const i=(y*W+x)*4;
          bgR+=px[i]; bgG+=px[i+1]; bgB+=px[i+2];
        });
        bgR/=samplePoints.length; bgG/=samplePoints.length; bgB/=samplePoints.length;
        onProgress && onProgress(50, 'flood-fill');
        const dist = new Float32Array(N);
        for (let i = 0; i < N; i++) {
          const dr=px[i*4]-bgR, dg=px[i*4+1]-bgG, db=px[i*4+2]-bgB;
          dist[i] = Math.sqrt(dr*dr+dg*dg+db*db);

          for (let y=1; y<H-1; y++) { if(!isBg[y*W]&&dist[y*W]<=threshold){isBg[y*W]=1;queue[qTail++]=y*W;} if(!isBg[y*W+W-1]&&dist[y*W+W-1]<=threshold){isBg[y*W+W-1]=1;queue[qTail++]=y*W+W-1;}}

}

// ── MaskEditorModal ──────────────────────────────────────────────────────────
function MaskEditorModal({ src, existingMask, onClose, onSave, onClearMask }) {
  const displayRef = useRef(null);
  const maskRef    = useRef(null);
  const origRef    = useRef(null);
  const [tool, setTool]       = useState('brush-erase');
  const [brushSize, setBrushSize] = useState(30);
  const [wandTol,  setWandTol]    = useState(35);
  const [hardness, setHardness]   = useState(80);
  const [cursorPos, setCursorPos] = useState({x:-999,y:-999});
  const [lassoActive, setLassoActive] = useState(false);
  const [lassoPoints, setLassoPoints] = useState([]);
  const painting = useRef(false);
  const CW = useRef(0), CH = useRef(0);

  useEffect(() => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      CW.current = img.width; CH.current = img.height;
      const oc = origRef.current;
      oc.width = img.width; oc.height = img.height;
      oc.getContext('2d').drawImage(img, 0, 0);
      const mc = maskRef.current;
      mc.width = img.width; mc.height = img.height;
      const mctx = mc.getContext('2d');
      if (existingMask) {
        const em = new Image();
        em.onload = () => {
          mctx.fillStyle = '#ffffff'; mctx.fillRect(0, 0, mc.width, mc.height);
          const tmp = document.createElement('canvas');
          tmp.width = mc.width; tmp.height = mc.height;
          const tctx = tmp.getContext('2d');
          tctx.drawImage(em, 0, 0);
          const emData = tctx.getImageData(0, 0, mc.width, mc.height);
          const maskData = mctx.getImageData(0, 0, mc.width, mc.height);
          for (let i = 0; i < emData.data.length; i += 4) {
            const a = emData.data[i+3];
            maskData.data[i] = maskData.data[i+1] = maskData.data[i+2] = a;
            maskData.data[i+3] = 255;
          }
          mctx.putImageData(maskData, 0, 0);
          renderDisplay();
        };
        em.src = existingMask;
      } else {
        mctx.fillStyle = '#ffffff';
        mctx.fillRect(0, 0, img.width, img.height);
        renderDisplay();
      }
    };
    img.src = src;
  }, []);

  function renderDisplay() {
    const dc = displayRef.current;
    const mc = maskRef.current;
    const oc = origRef.current;
    if (!dc || !mc || !oc || !CW.current) return;
    const W = CW.current, H = CH.current;
    dc.width = W; dc.height = H;
    const dctx = dc.getContext('2d');
    const sz = Math.max(6, Math.floor(W / 40));
    for (let y = 0; y < H; y += sz) for (let x = 0; x < W; x += sz) {
      dctx.fillStyle = ((Math.floor(x/sz)+Math.floor(y/sz))%2===0) ? '#d0d0d0' : '#999';
      dctx.fillRect(x, y, sz, sz);
    }
    const origData = oc.getContext('2d').getImageData(0, 0, W, H);
    const maskData = mc.getContext('2d').getImageData(0, 0, W, H);
    const composite = dctx.createImageData(W, H);
    for (let i = 0; i < origData.data.length; i += 4) {
      composite.data[i]   = origData.data[i];
      composite.data[i+1] = origData.data[i+1];
      composite.data[i+2] = origData.data[i+2];
      const maskLum = (0.299*maskData.data[i] + 0.587*maskData.data[i+1] + 0.114*maskData.data[i+2]) / 255;
      composite.data[i+3] = Math.round(origData.data[i+3] * maskLum);
    }
    dctx.putImageData(composite, 0, 0);
    if (lassoPoints.length > 1) {
      dctx.save();
      dctx.strokeStyle = '#ef4444'; dctx.lineWidth = 1.5;
      dctx.setLineDash([5, 3]);
      dctx.beginPath();
      dctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
      lassoPoints.forEach(p => dctx.lineTo(p.x, p.y));
      dctx.stroke();
      dctx.restore();
    }
  }

  useEffect(() => { renderDisplay(); }, [lassoPoints]);

  function getPos(e) {
    const rect = displayRef.current.getBoundingClientRect();
    const scaleX = CW.current / rect.width, scaleY = CH.current / rect.height;
    const cl = e.touches ? e.touches[0] : e;
    return { x: Math.round((cl.clientX - rect.left) * scaleX), y: Math.round((cl.clientY - rect.top) * scaleY) };
  }

  function paintMask(x, y, erase) {
    const mc = maskRef.current;
    const mctx = mc.getContext('2d');
    const r = brushSize / 2;
    const hardRatio = hardness / 100;
    if (erase) {
      const grad = mctx.createRadialGradient(x, y, r*hardRatio, x, y, r);
      grad.addColorStop(0, 'rgba(0,0,0,1)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      mctx.globalCompositeOperation = 'source-over';
      mctx.fillStyle = grad;
      mctx.beginPath(); mctx.arc(x, y, r, 0, Math.PI*2); mctx.fill();
    } else {
      const grad = mctx.createRadialGradient(x, y, r*hardRatio, x, y, r);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      mctx.globalCompositeOperation = 'source-over';
      mctx.fillStyle = grad;
      mctx.beginPath(); mctx.arc(x, y, r, 0, Math.PI*2); mctx.fill();
    }
    renderDisplay();
  }

  function wandErase(x, y) {
    const oc = origRef.current;
    const mc = maskRef.current;
    const W = CW.current, H = CH.current;
    const origData = oc.getContext('2d').getImageData(0, 0, W, H);
    const maskData = mc.getContext('2d').getImageData(0, 0, W, H);
    const px = origData.data;
    const idx0 = (y * W + x) * 4;
    const seedR = px[idx0], seedG = px[idx0+1], seedB = px[idx0+2];
    const visited = new Uint8Array(W * H);
    const queue = [y * W + x];
    visited[y * W + x] = 1;
    while (queue.length) {
      const idx = queue.pop();
      const xi = idx % W, yi = (idx / W) | 0;
      const pi = idx * 4;
      const dr = px[pi]-seedR, dg = px[pi+1]-seedG, db = px[pi+2]-seedB;
      if (Math.sqrt(dr*dr+dg*dg+db*db) > wandTol) continue;
      maskData.data[pi] = maskData.data[pi+1] = maskData.data[pi+2] = 0;
      for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nx=xi+dx, ny=yi+dy;
        if (nx<0||nx>=W||ny<0||ny>=H) continue;
        const ni = ny*W+nx;
        if (!visited[ni]) { visited[ni]=1; queue.push(ni); }
      }
    }
    mc.getContext('2d').putImageData(maskData, 0, 0);
    renderDisplay();
  }

  function applyLasso(pts, erase) {
    if (pts.length < 3) return;
    const mc = maskRef.current;
    const mctx = mc.getContext('2d');
    mctx.save();
    mctx.beginPath();
    mctx.moveTo(pts[0].x, pts[0].y);
    pts.forEach(p => mctx.lineTo(p.x, p.y));
    mctx.closePath();
    mctx.clip();
    mctx.fillStyle = erase ? '#000' : '#fff';
    mctx.fillRect(0, 0, CW.current, CH.current);
    mctx.restore();
    renderDisplay();
  }

  function onMouseDown(e) {
    e.preventDefault();
    const p = getPos(e);
    if (tool === 'lasso') {
      if (!lassoActive) { setLassoActive(true); setLassoPoints([p]); }
      return;
    }
    if (tool === 'wand') { wandErase(p.x, p.y); return; }
    painting.current = true;
    paintMask(p.x, p.y, tool === 'brush-erase');
  }
  function onMouseMove(e) {
    const p = getPos(e);
    setCursorPos({ x: e.clientX, y: e.clientY });
    if (tool === 'lasso' && lassoActive) { setLassoPoints(prev => [...prev, p]); return; }
    if (!painting.current) return;
    paintMask(p.x, p.y, tool === 'brush-erase');
  }
  function onMouseUp(e) {
    painting.current = false;
    if (tool === 'lasso' && lassoActive) {
      applyLasso(lassoPoints, true);
      setLassoActive(false);
      setLassoPoints([]);
    }
  }

  function exportMasked() {
    const oc = origRef.current;
    const mc = maskRef.current;
    const W = CW.current, H = CH.current;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const origData = oc.getContext('2d').getImageData(0, 0, W, H);
    const maskData = mc.getContext('2d').getImageData(0, 0, W, H);
    const out = ctx.createImageData(W, H);
    for (let i = 0; i < origData.data.length; i += 4) {
      out.data[i]   = origData.data[i];
      out.data[i+1] = origData.data[i+1];
      out.data[i+2] = origData.data[i+2];
      const ml = (0.299*maskData.data[i]+0.587*maskData.data[i+1]+0.114*maskData.data[i+2])/255;
      out.data[i+3] = Math.round(origData.data[i+3] * ml);
    }
    ctx.putImageData(out, 0, 0);
    return cv.toDataURL('image/png');
  }

  const displayBrushPx = displayRef.current
    ? brushSize * (displayRef.current.getBoundingClientRect().width / (CW.current || 1))
    : brushSize;

  const TOOLS = [
    { id:'brush-erase',   label:'🖌 Erase Brush' },
    { id:'brush-restore', label:'✏️ Restore Brush' },
    { id:'lasso',         label:'🔲 Lasso Erase' },
    { id:'wand',          label:'🪄 Magic Wand' },
  ];

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:300,display:'flex',flexDirection:'column'}}>
      {(tool==='brush-erase'||tool==='brush-restore') && (
        <div style={{position:'fixed',left:cursorPos.x,top:cursorPos.y,width:displayBrushPx,height:displayBrushPx,borderRadius:'50%',
          border:`2px solid ${tool==='brush-erase'?'rgba(239,68,68,0.9)':'rgba(34,197,94,0.9)'}`,
          transform:'translate(-50%,-50%)',zIndex:9999,pointerEvents:'none'}} />
      )}
      <div style={{background:'#141414',borderBottom:'1px solid #222',padding:'10px 18px',display:'flex',alignItems:'center',gap:12,flexShrink:0,flexWrap:'wrap'}}>
        <span style={{fontFamily:"'Bebas Neue',cursive",fontSize:18,color:'#ef4444',letterSpacing:2}}>🎭 MASK EDITOR</span>
        <div style={{display:'flex',gap:4,marginLeft:8}}>
          {TOOLS.map(t=>(
            <button key={t.id}
              style={{padding:'5px 10px',borderRadius:6,border:`1px solid ${tool===t.id?'#ef4444':'#333'}`,
                background:tool===t.id?'#ef4444':'transparent',color:tool===t.id?'#000':'#888',
                cursor:'pointer',fontSize:11,fontFamily:"'DM Mono',monospace",transition:'all 0.15s'}}
              onClick={()=>{setTool(t.id);setLassoActive(false);setLassoPoints([]);}}>
              {t.label}
            </button>
          ))}
        </div>
        <div style={{width:1,height:22,background:'#2a2a2a'}} />
        {(tool==='brush-erase'||tool==='brush-restore') && (
          <>
            <div style={{display:'flex',alignItems:'center',gap:6,minWidth:130}}>
              <span style={{fontSize:10,color:'#555',whiteSpace:'nowrap'}}>Size {brushSize}px</span>
              <input type="range" min={4} max={200} value={brushSize} onChange={e=>setBrushSize(+e.target.value)} style={{width:80,accentColor:'#ef4444'}} />
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,minWidth:130}}>
              <span style={{fontSize:10,color:'#555',whiteSpace:'nowrap'}}>Hardness {hardness}%</span>
              <input type="range" min={0} max={100} value={hardness} onChange={e=>setHardness(+e.target.value)} style={{width:80,accentColor:'#ef4444'}} />
            </div>
          </>
        )}
        {tool==='wand' && (
          <div style={{display:'flex',alignItems:'center',gap:6,minWidth:150}}>
            <span style={{fontSize:10,color:'#555',whiteSpace:'nowrap'}}>Tolerance {wandTol}</span>
            <input type="range" min={5} max={120} value={wandTol} onChange={e=>setWandTol(+e.target.value)} style={{width:90,accentColor:'#ef4444'}} />
          </div>
        )}
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button onClick={()=>{const mc=maskRef.current;const mctx=mc.getContext('2d');const md=mctx.getImageData(0,0,CW.current,CH.current);for(let i=0;i<md.data.length;i+=4){md.data[i]=255-md.data[i];md.data[i+1]=255-md.data[i+1];md.data[i+2]=255-md.data[i+2];}mctx.putImageData(md,0,0);renderDisplay();}}
            style={{padding:'5px 10px',borderRadius:6,border:'1px solid #333',background:'transparent',color:'#888',cursor:'pointer',fontSize:11,fontFamily:"'DM Mono',monospace"}}>⇄ Invert</button>
          <button onClick={()=>{const mc=maskRef.current;const mctx=mc.getContext('2d');mctx.fillStyle='#fff';mctx.fillRect(0,0,CW.current,CH.current);renderDisplay();}}
            style={{padding:'5px 10px',borderRadius:6,border:'1px solid #333',background:'transparent',color:'#888',cursor:'pointer',fontSize:11,fontFamily:"'DM Mono',monospace"}}>↺ Reset</button>
        </div>
      </div>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'#0a0a0a',overflow:'hidden',cursor:'none',position:'relative'}}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={()=>{painting.current=false;}}>
        <canvas ref={displayRef} style={{maxWidth:'90%',maxHeight:'90%',imageRendering:'pixelated',boxShadow:'0 0 60px rgba(0,0,0,0.8), 0 0 0 1px #222',cursor:tool==='wand'?'crosshair':tool==='lasso'?'crosshair':'none'}} />
        <canvas ref={maskRef} style={{display:'none'}} />
        <canvas ref={origRef} style={{display:'none'}} />
      </div>
      <div style={{background:'#141414',borderTop:'1px solid #222',padding:'10px 18px',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
        <span style={{fontSize:10,color:'#444',marginRight:'auto',fontFamily:"'DM Mono',monospace"}}>🖌 Brush · 🪄 Wand · 🔲 Lasso · ✏️ Restore · Checkerboard = transparent</span>
        <button onClick={onClearMask} style={{padding:'7px 14px',borderRadius:6,border:'1px solid #333',background:'transparent',color:'#888',cursor:'pointer',fontSize:11,fontFamily:"'DM Mono',monospace"}}>🗑 Remove All Masking</button>
        <button onClick={onClose} style={{padding:'7px 14px',borderRadius:6,border:'1px solid #333',background:'transparent',color:'#aaa',cursor:'pointer',fontSize:11,fontFamily:"'DM Mono',monospace"}}>Cancel</button>
        <button onClick={()=>onSave(exportMasked())} style={{padding:'7px 16px',borderRadius:6,border:'none',background:'#ef4444',color:'#fff',cursor:'pointer',fontSize:11,fontFamily:"'DM Mono',monospace",fontWeight:500}}>✅ Apply Mask</button>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App(){
  // ── Sanitize: only fix missing shirtSize, never null out image paths ──
  function sanitize(designs){
    return designs.map(d=>({
      ...d,
      shirtSize: d.shirtSize || "M",
      // Preserve ALL shirtImages as-is — file paths and data: URLs both valid
      shirtImages: d.shirtImages || {},
    }));
  }

  // ── Always read fresh from localStorage, never from stale closure ──
  function lsLoad(){
    try{
      const raw = localStorage.getItem("dirtshirt_designs");
      if(raw){
        const p = JSON.parse(raw);
        if(Array.isArray(p) && p.length > 0) return sanitize(p);
      }
    }catch(e){ console.warn("lsLoad error", e); }
    return null;
  }

  // ── Save full array — always write, even if length is 0 ──
  function lsSave(designs){
    try{
      localStorage.setItem("dirtshirt_designs", JSON.stringify(designs));
    }catch(e){ console.warn("lsSave error", e); }
  }

  // ── Upsert a single design by reading fresh from storage first ──
  function lsSaveOne(design){
    try{
      const raw = localStorage.getItem("dirtshirt_designs");
      const all = raw ? JSON.parse(raw) : [];
      const exists = all.some(d => String(d.id) === String(design.id));
      const next = exists
        ? all.map(d => String(d.id) === String(design.id) ? design : d)
        : [design, ...all];
      localStorage.setItem("dirtshirt_designs", JSON.stringify(next));
    }catch(e){ console.warn("lsSaveOne error", e); }
  }

  // ── Delete by reading fresh from storage first ──
  function lsDelete(id){
    try{
      const raw = localStorage.getItem("dirtshirt_designs");
      if(!raw) return;
      const next = JSON.parse(raw).filter(d => String(d.id) !== String(id));
      localStorage.setItem("dirtshirt_designs", JSON.stringify(next));
    }catch(e){ console.warn("lsDelete error", e); }
  }

  // ── State ─────────────────────────────────────────────────────────────────
  const[designs, setDesigns] = useState(() => lsLoad() || []);
  const[activeId, setActiveId] = useState(() => { const s=lsLoad(); return s&&s.length>0?s[0].id:null; });
  const[view, setView] = useState("editor");
  const importRef = useRef(null);
  const isInitialized = useRef(false);

  // ── Export all designs as a JSON backup file ─────────────────────────────
  function exportDesigns(){
    const data = JSON.stringify(designs, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `dirtshirt-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Import designs from a JSON backup file ────────────────────────────────
  function importDesigns(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const imported = JSON.parse(ev.target.result);
        if(!Array.isArray(imported)) throw new Error("Invalid format");
        const cleaned = sanitize(imported);
        // Merge: imported designs win for matching IDs, keep existing unique ones
        const importedIds = new Set(cleaned.map(d=>String(d.id)));
        const existing    = designs.filter(d=>!importedIds.has(String(d.id)));
        const merged      = [...cleaned, ...existing];
        setDesigns(merged);
        lsSave(merged);
        if(merged.length > 0) setActiveId(merged[0].id);
        alert(`✅ Imported ${cleaned.length} design${cleaned.length!==1?"s":""}!`);
      }catch(err){
        alert("❌ Could not read backup file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  // ── CRUD — writes localStorage AND Firestore in parallel ─────────────────
  function createDesign(name){
    const d = blankDesign(name||"New Design");
    setDesigns(prev=>{ const next=[d,...prev]; lsSave(next); return next; });
    setActiveId(d.id); setView("editor");
    return d;
  }

  function saveDesign(updated){
    setDesigns(prev=>{ const next=prev.map(d=>d.id===updated.id?updated:d); lsSave(next); return next; });
    setActiveId(updated.id);
  }

  function duplicateDesign(d){
    const copy={...JSON.parse(JSON.stringify(d)),id:Date.now()+Math.random(),name:d.name+" (Copy)"};
    setDesigns(prev=>{ const next=[copy,...prev]; lsSave(next); return next; });
    setActiveId(copy.id); setView("editor");
  }

  function deleteDesign(id){
    setDesigns(prev=>{ const next=prev.filter(d=>d.id!==id); lsSave(next); return next; });
    if(activeId===id){ setActiveId(null); setView("library"); }
  }

  // ── Create starter design only if truly nothing anywhere ──────────────────
  useEffect(()=>{
    if(isInitialized.current) return;
    isInitialized.current = true;
    const saved = lsLoad();
    if(!saved||saved.length===0) createDesign("My First Design");
  },[]);

  const activeDesign = designs.find(d=>d.id===activeId)||null;

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      <div className="header">
        <span className="logo-dirt">DIRT</span><span className="logo-shirt">SHIRT</span><span className="logo-des">DESIGNER</span>
        <span style={{color:"#2a2a2a",fontSize:20,lineHeight:1,margin:"0 4px"}}>|</span>
        <span className="logo-sub">DTF Transfer Studio</span>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={importDesigns} />
          <button className="btn btn-ghost" style={{fontSize:10,padding:"5px 12px"}} onClick={exportDesigns} title="Download all designs as a backup file">⬇ Export Backup</button>
          <button className="btn btn-ghost" style={{fontSize:10,padding:"5px 12px"}} onClick={()=>importRef.current.click()} title="Restore designs from a backup file">⬆ Import Backup</button>
          <button className="btn btn-ghost" onClick={()=>setView("library")}>📂 My Designs ({designs.length})</button>
          <button className="btn btn-primary" onClick={()=>createDesign()}>+ New Design</button>
        </div>
      </div>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {view==="library"
          ?<Library designs={designs} onOpen={d=>{if(!d.locked)setActiveId(d.id);setView("editor");}} onDuplicate={duplicateDesign} onDelete={deleteDesign} onLock={id=>setDesigns(prev=>{const next=prev.map(d=>d.id===id?{...d,locked:!d.locked}:d);lsSave(next);return next;})} onNew={()=>createDesign()} />
          :activeDesign
            ?<Editor key={activeDesign.id} design={activeDesign} onSave={saveDesign} onDuplicate={()=>duplicateDesign(activeDesign)} onBack={()=>setView("library")} />
            :<div style={{display:"flex",justifyContent:"center",alignItems:"center",flex:1,flexDirection:"column",gap:16}}><p style={{color:"#555"}}>No design selected</p><button className="btn btn-primary" onClick={()=>createDesign()}>Create New Design</button></div>
        }
      </div>
    </div>
  );
}

// ─── Library ─────────────────────────────────────────────────────────────────

        :<div className="lib-grid">{designs.map(d=>{const totalLayers=Object.values(d.zones||{}).reduce((s,z)=>s+(z.layers?.length||0),0);return(

              {d.thumbnail?<img src={d.thumbnail} alt="" />:<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><div style={{fontSize:36,opacity:0.12}}>👕</div><div style={{fontSize:8,color:"#2a2a2a",fontFamily:"'DM Mono',monospace",textAlign:"center",padding:"0 8px"}}>save to preview</div></div>}
              {d.locked&&(<div style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.7)",borderRadius:5,padding:"3px 6px",fontSize:11,lineHeight:1}}>🔒</div>)}
              <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,opacity:0,transition:"opacity 0.15s"}}
                onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0}>
                {!d.locked&&<button className="btn btn-primary" style={{fontSize:10,padding:"5px 14px",width:"80%"}} onClick={e=>{e.stopPropagation();onOpen(d);}}>✏️ Edit</button>}
                {!d.locked&&<button className="btn btn-ghost" style={{fontSize:10,padding:"5px 14px",width:"80%"}} onClick={e=>{e.stopPropagation();onDuplicate(d);}}>⧉ Duplicate</button>}
                <button className="btn btn-ghost" style={{fontSize:10,padding:"5px 14px",width:"80%",borderColor:d.locked?"rgba(249,115,22,0.5)":"#333",color:d.locked?"#f97316":"#aaa"}} onClick={e=>{e.stopPropagation();onLock(d.id);}}>{d.locked?"🔓 Unlock":"🔒 Lock"}</button>
                {!d.locked&&<button className="btn btn-danger" style={{fontSize:10,padding:"5px 14px",width:"80%"}} onClick={e=>{e.stopPropagation();if(window.confirm(`Delete "${d.name}"? This cannot be undone.`))onDelete(d.id);}}>🗑 Delete</button>}
              </div>
            </div>
            <div className="design-card-info">
              <div style={{fontWeight:500,fontSize:11,color:d.locked?"#888":"#d0d0d0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
              <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>{d.shirtType==="short"?"S/S":"L/S"} · {d.shirtSize||"M"} · {totalLayers} layer{totalLayers!==1?"s":""}</div>
            </div>
          </div>
        );})}</div>
      }
    </div>
  );
}

// ─── Editor ──────────────────────────────────────────────────────────────────
function Editor({design,onSave,onDuplicate,onBack}){
  const[d,setD]=useState(()=>JSON.parse(JSON.stringify(design)));
  const[selectedLayer,setSelectedLayer]=useState(null);
  const[showAIBgRemoval,setShowAIBgRemoval]=useState(false);
  const[showBgEraser,setShowBgEraser]=useState(false);
  const[editingName,setEditingName]=useState(false);
  const[nameVal,setNameVal]=useState(d.name);
  const[offsets,setOffsets]=useState(()=>JSON.parse(JSON.stringify(ZONE_OFFSET)));
  const[showNudge,setShowNudge]=useState(false);
  const[copied,setCopied]=useState(false);
  const[showDrawing,setShowDrawing]=useState(false);
  const[editingLayerId,setEditingLayerId]=useState(null);
  const[showAI,setShowAI]=useState(false);
  const[showMaskEditor,setShowMaskEditor]=useState(false);
  const[maskLayerId,setMaskLayerId]=useState(null);
  const[stageMode,setStageMode]=useState('shirt');
  const[showDTFOnShirt,setShowDTFOnShirt]=useState(false);
  const stageRef=useRef(null),isDragging=useRef(false),dragStart=useRef({}),artFileRef=useRef(null),shirtCanvasRef=useRef(null);

  const zone=d.zones[d.activeZone];
  const allZones=[...SHIRT_ZONES.short,...SHIRT_ZONES.long];
  const zoneInfo=allZones.find(z=>z.id===d.activeZone);
  const sizeSpec=SIZE_SPECS[d.shirtSize||"M"];
  const isSleeveZone=d.activeZone.includes("sleeve");
  const activeMaxW=isSleeveZone?(zoneInfo?.maxW||4):sizeSpec.maxW;
  const activeMaxH=isSleeveZone?(zoneInfo?.maxH||14):sizeSpec.maxH;
  const selLayer=zone.layers.find(l=>l.id===selectedLayer);
  const dtfInfo=selLayer?calcDTF(selLayer.w,selLayer.h,activeMaxW,activeMaxH):null;
  const currentShirtImg=d.shirtImages?.[d.activeZone];

  const upd=useCallback(patch=>setD(p=>({...p,...patch})),[]);
  const updZone=useCallback((zid,patch)=>setD(p=>({...p,zones:{...p.zones,[zid]:{...p.zones[zid],...patch}}})),[]);
  const updLayer=useCallback((lid,patch)=>{setD(p=>{const layers=p.zones[p.activeZone].layers.map(l=>l.id===lid?{...l,...patch}:l);return{...p,zones:{...p.zones,[p.activeZone]:{...p.zones[p.activeZone],layers}}};});},[]);
  const updOffset=useCallback((zid,patch)=>setOffsets(o=>({...o,[zid]:{...o[zid],...patch}})),[]);

  useEffect(()=>{
    function onKeyDown(e){if(!selectedLayer)return;if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();deleteLayer(selectedLayer);}}
    window.addEventListener("keydown",onKeyDown);return()=>window.removeEventListener("keydown",onKeyDown);
  },[selectedLayer]);

  function setShirtImg(zid,src){setD(p=>({...p,shirtImages:{...p.shirtImages,[zid]:src}}));}
  function addArtLayer(dataUrl){
    const img=new Image();
    img.onload=()=>{
      const asp=img.width>0&&img.height>0?img.width/img.height:1;
      const w=40,h=Math.max(5,w/asp);
      const layer={id:Date.now()+Math.random(),src:dataUrl,x:30,y:20,w,h,opacity:100,rotation:0,locked:false};
      updZone(d.activeZone,{layers:[...zone.layers,layer]});
      setSelectedLayer(layer.id);
    };
    img.crossOrigin="anonymous";img.src=dataUrl;
    if(img.complete&&img.naturalWidth>0)img.onload();
  }
  function handleArtFile(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>addArtLayer(ev.target.result);reader.readAsDataURL(file);e.target.value="";}
  function deleteLayer(id){updZone(d.activeZone,{layers:zone.layers.filter(l=>l.id!==id)});if(selectedLayer===id)setSelectedLayer(null);}
  function reorderLayer(id,dir){const layers=[...zone.layers],idx=layers.findIndex(l=>l.id===id),ni=idx+dir;if(ni<0||ni>=layers.length)return;[layers[idx],layers[ni]]=[layers[ni],layers[idx]];updZone(d.activeZone,{layers});}
  function layerAt(cx,cy){for(let i=zone.layers.length-1;i>=0;i--){const l=zone.layers[i];const lx=(l.x/100)*STAGE_W,ly=(l.y/100)*STAGE_H,lw=(l.w/100)*STAGE_W,lh=(l.h/100)*STAGE_H;if(cx>=lx&&cx<=lx+lw&&cy>=ly&&cy<=ly+lh)return l;}return null;}
  function onMD(e){const rect=stageRef.current.getBoundingClientRect();const cx=e.clientX-rect.left,cy=e.clientY-rect.top;const layer=layerAt(cx,cy);if(layer&&!layer.locked){setSelectedLayer(layer.id);isDragging.current=true;dragStart.current={cx,cy,ox:layer.x,oy:layer.y};}else if(!layer)setSelectedLayer(null);}
  function onMM(e){if(!isDragging.current||!selectedLayer)return;const rect=stageRef.current.getBoundingClientRect();const cx=e.clientX-rect.left,cy=e.clientY-rect.top;const dx=((cx-dragStart.current.cx)/STAGE_W)*100,dy=((cy-dragStart.current.cy)/STAGE_H)*100;updLayer(selectedLayer,{x:dragStart.current.ox+dx,y:dragStart.current.oy+dy});}
  function onMU(){isDragging.current=false;}

  async function download(withShirt){
    const SW=STAGE_W,SH=STAGE_H,sc=4,OW=SW*sc,OH=SH*sc;
    const cv=document.createElement("canvas");cv.width=OW;cv.height=OH;
    const ctx=cv.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    if(withShirt){
      const liveCanvas=shirtCanvasRef.current;
      if(liveCanvas){
        // Draw shirt canvas pixel-perfect — no smoothing to avoid color shift
        ctx.imageSmoothingEnabled=false;
        ctx.drawImage(liveCanvas,0,0,OW,OH);
        ctx.imageSmoothingEnabled=true;
      }else{
        ctx.fillStyle=d.shirtColor||"#d3783c";
        ctx.fillRect(0,0,OW,OH);
      }
    }
    for(const layer of zone.layers){
      await new Promise(res=>{
        const img=new Image();
        img.onload=()=>{
          const natW=img.naturalWidth||img.width,natH=img.naturalHeight||img.height;
          const lx=(layer.x/100)*OW,ly=(layer.y/100)*OH,lw=(layer.w/100)*OW,lh=(layer.h/100)*OH;
          const imgAsp=natW/natH,boxAsp=lw/lh;
          let drawW,drawH;
          if(imgAsp>boxAsp){drawW=lw;drawH=lw/imgAsp;}else{drawH=lh;drawW=lh*imgAsp;}
          const offX=(lw-drawW)/2,offY=(lh-drawH)/2;
          ctx.save();ctx.globalAlpha=layer.opacity/100;ctx.translate(lx+lw/2,ly+lh/2);ctx.rotate((layer.rotation||0)*Math.PI/180);ctx.drawImage(img,-lw/2+offX,-lh/2+offY,drawW,drawH);ctx.restore();ctx.globalAlpha=1;res();
        };
        img.src=layer.maskSrc||layer.src;
      });
    }
    const a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download=`${d.name.replace(/\s+/g,"-")}-${d.activeZone}${withShirt?"-with-shirt":"-logo"}.png`;a.click();
  }

  async function generateThumbnail(){
    const TW=420,TH=520;
    const stage=document.createElement("canvas");stage.width=TW;stage.height=TH;
    const sctx=stage.getContext("2d");sctx.clearRect(0,0,TW,TH);
    const src=d.shirtImages?.[d.activeZone];
    if(src){
      await new Promise(res=>{
        const img=new Image();img.crossOrigin="anonymous";
        img.onload=()=>{
          const tmp=document.createElement("canvas");tmp.width=img.width;tmp.height=img.height;
          const tctx=tmp.getContext("2d");tctx.drawImage(img,0,0);
          const raw=tctx.getImageData(0,0,img.width,img.height);
          const rp=raw.data,RW=img.width,RH=img.height;
          let minX=RW,maxX=0,minY=RH,maxY=0;
          const cornerLum=(0.299*rp[0]+0.587*rp[1]+0.114*rp[2])/255;
          const isLightBg=cornerLum>=0.12,LUM_THRESH=cornerLum<0.12?0.06:0.94;
          for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){const i=(y*RW+x)*4;const lum=(0.299*rp[i]+0.587*rp[i+1]+0.114*rp[i+2])/255;const isShirt=isLightBg?lum<LUM_THRESH:lum>LUM_THRESH;if(isShirt){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}}
          const padX=Math.floor(RW*0.02),padY=Math.floor(RH*0.02);
          minX=Math.max(0,minX-padX);maxX=Math.min(RW-1,maxX+padX);minY=Math.max(0,minY-padY);maxY=Math.min(RH-1,maxY+padY);
          const cropW=maxX-minX+1,cropH=maxY-minY+1;
          const scale=Math.min(TW/cropW,TH/cropH)*0.96;
          const dw=cropW*scale,dh=cropH*scale,dx=(TW-dw)/2,dy=(TH-dh)/2;
          const coloredTmp=document.createElement("canvas");coloredTmp.width=RW;coloredTmp.height=RH;
          const cctx=coloredTmp.getContext("2d");cctx.drawImage(img,0,0);
          const cdata=cctx.getImageData(0,0,RW,RH);const cpx=cdata.data;
          let sr2=0,sg2=0,sb2=0,sc3=0;
          for(let x=0;x<RW;x++){for(const yy of[0,RH-1]){const i=(yy*RW+x)*4;sr2+=cpx[i];sg2+=cpx[i+1];sb2+=cpx[i+2];sc3++;}}
          for(let y=1;y<RH-1;y++){for(const x of[0,RW-1]){const i=(y*RW+x)*4;sr2+=cpx[i];sg2+=cpx[i+1];sb2+=cpx[i+2];sc3++;}}
          const bgR2=Math.round(sr2/sc3),bgG2=Math.round(sg2/sc3),bgB2=Math.round(sb2/sc3);
          const bgLum2=(0.299*bgR2+0.587*bgG2+0.114*bgB2)/255;const isDark2=bgLum2<0.12;
          const iBg2=new Uint8Array(RW*RH),iq2=new Int32Array(RW*RH*2);let iqH2=0,iqT2=0;
          function sp2(i){if(!iBg2[i]){iBg2[i]=1;iq2[iqT2++]=i;}}
          for(let x=0;x<RW;x++){sp2(x);sp2((RH-1)*RW+x);}for(let y=1;y<RH-1;y++){sp2(y*RW);sp2(y*RW+RW-1);}
          while(iqH2<iqT2){const idx=iq2[iqH2++],ix=idx%RW,iy=(idx/RW)|0;for(let dy2=-1;dy2<=1;dy2++)for(let dx2=-1;dx2<=1;dx2++){if(!dx2&&!dy2)continue;const nx=ix+dx2,ny=iy+dy2;if(nx<0||nx>=RW||ny<0||ny>=RH)continue;const ni=ny*RW+nx;if(iBg2[ni])continue;const np=ni*4,nr=cpx[np],ng=cpx[np+1],nb3=cpx[np+2];let hit=false;if(isDark2){const pl=(0.299*nr+0.587*ng+0.114*nb3)/255;hit=pl<0.06;}else{const dr=nr-bgR2,dg=ng-bgG2,db=nb3-bgB2;hit=Math.sqrt(dr*dr+dg*dg+db*db)<35;}if(hit){iBg2[ni]=1;iq2[iqT2++]=ni;}}}
          const[tR2,tG2,tB2]=hexToRgb(d.shirtColor||"#ffffff");
          let sr3=0,sg3=0,sb3=0,sn3=0;
          for(let i=0;i<RW*RH;i++){if(iBg2[i])continue;const pi=i*4;if(cpx[pi+3]<10)continue;sr3+=cpx[pi];sg3+=cpx[pi+1];sb3+=cpx[pi+2];sn3++;}
          const avR=sn3>0?sr3/sn3:1,avG=sn3>0?sg3/sn3:1,avB=sn3>0?sb3/sn3:1;
          const rtR=avR>0?tR2/avR:1,rtG=avG>0?tG2/avG:1,rtB=avB>0?tB2/avB:1;
          for(let i=0;i<RW*RH;i++){if(iBg2[i])continue;const pi=i*4;if(cpx[pi+3]<10)continue;cpx[pi]=Math.min(255,Math.max(0,Math.round(cpx[pi]*rtR)));cpx[pi+1]=Math.min(255,Math.max(0,Math.round(cpx[pi+1]*rtG)));cpx[pi+2]=Math.min(255,Math.max(0,Math.round(cpx[pi+2]*rtB)));}
          cctx.putImageData(cdata,0,0);
          sctx.drawImage(cctx.canvas,minX,minY,cropW,cropH,dx,dy,dw,dh);
          res();
        };
        img.src=src;
      });
    }
    for(const layer of zone.layers){
      await new Promise(res=>{
        const img=new Image();
        img.onload=()=>{
          sctx.globalAlpha=layer.opacity/100;
          const lx=(layer.x/100)*TW,ly=(layer.y/100)*TH,lw=(layer.w/100)*TW,lh=(layer.h/100)*TH;
          const natW=img.naturalWidth||img.width,natH=img.naturalHeight||img.height;
          const imgAsp=natW/natH,boxAsp=lw/lh;
          let drawW,drawH;
          if(imgAsp>boxAsp){drawW=lw;drawH=lw/imgAsp;}else{drawH=lh;drawW=lh*imgAsp;}
          const offX=(lw-drawW)/2,offY=(lh-drawH)/2;
          sctx.save();sctx.translate(lx+lw/2,ly+lh/2);sctx.rotate((layer.rotation||0)*Math.PI/180);
          sctx.drawImage(img,-lw/2+offX,-lh/2+offY,drawW,drawH);sctx.restore();sctx.globalAlpha=1;res();
        };
        img.src=layer.maskSrc||layer.src;
      });
    }
    return stage.toDataURL("image/png");
  }

                    style={{position:"absolute",left:lx,top:ly,width:lw,height:lh,zIndex:10,opacity:layer.opacity/100,transform:`rotate(${layer.rotation||0}deg)`,transformOrigin:"center center",outline:isSel?"2px solid #ef4444":"none",cursor:layer.locked?"not-allowed":"move"}}
                    onDoubleClick={e=>{e.stopPropagation();if(!layer.locked){setMaskLayerId(layer.id);setShowMaskEditor(true);}}}>
                    <img src={layer.maskSrc||layer.src} style={{width:"100%",height:"100%",objectFit:"contain",display:"block",pointerEvents:"none"}} alt="" draggable={false} />
                    {isSel&&<div className="resize-handle" onMouseDown={e=>{e.stopPropagation();const sx=e.clientX,sy=e.clientY,sw=layer.w,sh=layer.h;const mv=ev=>updLayer(layer.id,{w:Math.max(5,sw+((ev.clientX-sx)/STAGE_W)*100),h:Math.max(5,sh+((ev.clientY-sy)/STAGE_H)*100)});const up=()=>{window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);};window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);}} />}
                  </div>);
                })}
              </div>
            )}

            {stageMode==='dtf'&&(
              <div style={{position:"relative",width:STAGE_W,height:STAGE_H,borderRadius:10,background:"#0d0d0d",boxShadow:"0 0 0 1px #1e1e1e, 0 30px 80px rgba(0,0,0,0.56)",overflow:"visible"}}>
                <svg width={STAGE_W} height={STAGE_H} style={{position:"absolute",inset:0,borderRadius:10,overflow:"hidden"}}>
                  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="0.5"/></pattern></defs>
                  <rect width="100%" height="100%" fill="url(#grid)" rx="10"/>
                </svg>
                {zone.layers.map(layer=>{
                  const lx=(layer.x/100)*STAGE_W,ly=(layer.y/100)*STAGE_H,lw=(layer.w/100)*STAGE_W,lh=(layer.h/100)*STAGE_H;
                  return(<div key={layer.id} style={{position:"absolute",left:lx,top:ly,width:lw,height:lh,zIndex:5,opacity:layer.opacity/100,transform:`rotate(${layer.rotation||0}deg)`,transformOrigin:"center center",pointerEvents:"none"}}>
                    <img src={layer.maskSrc||layer.src} style={{width:"100%",height:"100%",objectFit:"contain",display:"block"}} alt="" draggable={false} />
                  </div>);
                })}
                {!isSleeveZone && makeDtfOverlay(true)}
                {isSleeveZone && <div className="print-guide" />}
                {!isSleeveZone&&(
                  <div style={{position:"absolute",bottom:-90,left:"50%",transform:"translateX(-50%)",display:"flex",gap:12,alignItems:"center",whiteSpace:"nowrap",background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:"8px 16px"}}>
                    <div style={{textAlign:"center"}}><div style={{fontSize:8,color:"#444",textTransform:"uppercase",letterSpacing:1,fontFamily:"'DM Mono',monospace"}}>Size</div><div style={{fontFamily:"'Bebas Neue',cursive",fontSize:20,color:"#f97316",letterSpacing:1}}>{d.shirtSize}</div></div>
                    <div style={{width:1,height:32,background:"#222"}}/>
                    <div style={{textAlign:"center"}}><div style={{fontSize:8,color:"#444",textTransform:"uppercase",letterSpacing:1,fontFamily:"'DM Mono',monospace"}}>Max Print</div><div style={{fontFamily:"'Bebas Neue',cursive",fontSize:18,color:"#e8e8e8",letterSpacing:1}}>{fmtIn(sizeSpec.maxW)}" × {fmtIn(sizeSpec.maxH)}"</div></div>
                    <div style={{width:1,height:32,background:"#222"}}/>
                    <div style={{textAlign:"center"}}><div style={{fontSize:8,color:"rgba(255,200,0,0.7)",textTransform:"uppercase",letterSpacing:1,fontFamily:"'DM Mono',monospace"}}>From Collar</div><div style={{fontFamily:"'Bebas Neue',cursive",fontSize:18,color:"rgba(255,200,0,0.9)",letterSpacing:1}}>{fmtIn(sizeSpec.collarGap)}"</div></div>
                    <div style={{width:1,height:32,background:"#222"}}/>
                    <div style={{textAlign:"center"}}><div style={{fontSize:8,color:"rgba(130,200,255,0.7)",textTransform:"uppercase",letterSpacing:1,fontFamily:"'DM Mono',monospace"}}>From Bottom</div><div style={{fontFamily:"'Bebas Neue',cursive",fontSize:18,color:"rgba(130,200,255,0.9)",letterSpacing:1}}>{fmtIn(sizeSpec.bottomGap)}"</div></div>
                  </div>
                )}
              </div>
            )}

            {dtfInfo&&selLayer&&(
              <div style={{position:"absolute",bottom:12,left:"50%",transform:"translateX(-50%)",background:"#161616",border:"1px solid rgba(249,115,22,0.2)",borderRadius:8,padding:"6px 16px",display:"flex",gap:14,alignItems:"center",zIndex:30,pointerEvents:"none",whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
                <span style={{fontSize:10,color:"#f97316",textTransform:"uppercase",letterSpacing:1,fontFamily:"'DM Mono',monospace"}}>DTF · {d.shirtSize}</span>
                <span style={{fontFamily:"'Bebas Neue',cursive",fontSize:20,color:"#fff",letterSpacing:1}}>{dtfInfo.w}" × {dtfInfo.h}"</span>
                {!isSleeveZone&&<span style={{fontSize:9,color:"#555",fontFamily:"'DM Mono',monospace"}}>collar ↕ {fmtIn(sizeSpec.collarGap)}" · bottom ↕ {fmtIn(sizeSpec.bottomGap)}"</span>}
              </div>
            )}
          </>);
        })()}
      </div>

      {/* RIGHT */}
      <div className="right-panel">
        <div className="panel-section">
          {editingName?<input className="name-input" autoFocus value={nameVal} onChange={e=>setNameVal(e.target.value)} onBlur={()=>{upd({name:nameVal});setEditingName(false);}} onKeyDown={e=>e.key==="Enter"&&(upd({name:nameVal}),setEditingName(false))} />:<div className="name-display" onClick={()=>setEditingName(true)}>{d.name} <span style={{color:"#444",fontSize:11}}>✏️</span></div>}
          <div style={{display:"flex",gap:6,marginTop:8}}>
            <button className="btn btn-primary" style={{flex:1,fontSize:10,padding:"6px 0"}} onClick={async()=>{const thumb=await generateThumbnail();onSave({...d,thumbnail:thumb});}}>💾 Save</button>
            <button className="btn btn-ghost" style={{fontSize:10,padding:"6px 8px"}} onClick={onDuplicate}>⧉</button>
            <button className="btn btn-ghost" style={{fontSize:10,padding:"6px 8px"}} onClick={onBack}>← Back</button>
          </div>
        </div>
        <div className="panel-section">
          <div className="panel-label">Upload Art / Logo</div>
          <input ref={artFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleArtFile} />
          <button className="btn btn-primary" style={{width:"100%",padding:"9px 0",fontSize:12,marginBottom:6}} onClick={()=>artFileRef.current.click()}>📁 Upload Image</button>
          <button className="btn btn-ghost" style={{width:"100%",padding:"9px 0",fontSize:12,marginBottom:6}} onClick={()=>{setEditingLayerId(null);setShowDrawing(true);}}>✏️ Open Drawing Board</button>
          <button className="btn btn-ghost" style={{width:"100%",padding:"9px 0",fontSize:12,borderColor:"rgba(249,115,22,0.4)",color:"#f97316"}} onClick={()=>setShowAI(true)}>✨ AI Image Generator</button>
        </div>

        {showAIBgRemoval && selLayer && (
          <AIBgRemovalModal src={selLayer.src} onClose={() => setShowAIBgRemoval(false)} onSave={dataUrl => updLayer(selLayer.id, { src: dataUrl })} />
        )}
        {showBgEraser && selLayer && (
          <BgEraserModal src={selLayer.src} onClose={()=>setShowBgEraser(false)} onSave={dataUrl=>updLayer(selLayer.id,{src:dataUrl})} />
        )}
        {showDrawing && (
          <DrawingModal onClose={()=>{setShowDrawing(false);setEditingLayerId(null);}} initialImage={editingLayerId?zone.layers.find(l=>l.id===editingLayerId)?.src:null} onAdd={dataUrl=>{if(editingLayerId){updLayer(editingLayerId,{src:dataUrl});setEditingLayerId(null);}else{addArtLayer(dataUrl);}}} />
        )}
        {showAI && <AIGeneratorModal onClose={()=>setShowAI(false)} onAdd={addArtLayer} />}
        {showMaskEditor && maskLayerId && (() => {
          const ml = zone.layers.find(l=>l.id===maskLayerId);
          return ml ? (
            <MaskEditorModal src={ml.src} existingMask={ml.maskSrc||null}
              onClose={()=>{setShowMaskEditor(false);setMaskLayerId(null);}}
              onSave={maskedDataUrl=>{updLayer(maskLayerId,{maskSrc:maskedDataUrl});setShowMaskEditor(false);setMaskLayerId(null);}}
              onClearMask={()=>{updLayer(maskLayerId,{maskSrc:null});setShowMaskEditor(false);setMaskLayerId(null);}}
            />
          ) : null;
        })()}

        {selLayer ? (
          <div className="scrollable">
            <div className="panel-label">Layer Properties</div>
            <button className="btn btn-primary" style={{width:"100%",marginBottom:6,fontSize:11,padding:"7px 0"}} onClick={()=>{setEditingLayerId(selLayer.id);setShowDrawing(true);}}>✏️ Edit in Drawing Board</button>
            <div style={{marginBottom:10}}>
              <button className="btn btn-primary" style={{width:"100%",fontSize:11,padding:"9px 0",background:"linear-gradient(135deg,#f97316,#dc2626)",marginBottom:4}} onClick={() => setShowAIBgRemoval(true)}>🤖 AI Remove Background</button>
              <button className="btn btn-ghost" style={{width:"100%",fontSize:10,padding:"6px 0",borderColor:"rgba(249,115,22,0.3)",color:"#888"}} onClick={()=>setShowBgEraser(true)}>🖌️ Manual Brush Eraser</button>
            </div>
            <Slider label="Width %" value={selLayer.w} min={5} max={200} onChange={v=>updLayer(selLayer.id,{w:v})} />
            <Slider label="Height %" value={selLayer.h} min={5} max={200} onChange={v=>updLayer(selLayer.id,{h:v})} />
            <Slider label="X Position" value={selLayer.x} min={-50} max={150} onChange={v=>updLayer(selLayer.id,{x:v})} />
            <Slider label="Y Position" value={selLayer.y} min={-50} max={150} onChange={v=>updLayer(selLayer.id,{y:v})} />
            <Slider label="Opacity" value={selLayer.opacity} min={0} max={100} onChange={v=>updLayer(selLayer.id,{opacity:v})} />
            <Slider label="Rotation °" value={selLayer.rotation||0} min={-180} max={180} onChange={v=>updLayer(selLayer.id,{rotation:v})} />
            <button className="btn btn-ghost" style={{width:"100%",fontSize:11,padding:"8px 0",marginTop:10,borderColor:"rgba(249,115,22,0.4)",color:"#f97316"}}
              onClick={()=>{
                const img=new Image();
                img.onload=()=>{
                  const natW=img.naturalWidth||img.width,natH=img.naturalHeight||img.height;
                  const imgAsp=natW/natH,lw=selLayer.w,lh=selLayer.h,boxAsp=lw/lh;
                  let drawW,drawH;
                  if(imgAsp>boxAsp){drawW=lw;drawH=lw/imgAsp;}else{drawH=lh;drawW=lh*imgAsp;}
                  updLayer(selLayer.id,{x:50-lw/2,y:50-lh/2});
                };
                img.src=selLayer.maskSrc||selLayer.src;
              }}>
              ⊕ Center on Shirt
            </button>
            <div style={{marginTop:6,display:"flex",gap:5,flexWrap:"wrap"}}>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>reorderLayer(selLayer.id,-1)}>⬆ Fwd</button>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>reorderLayer(selLayer.id,1)}>⬇ Back</button>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>updLayer(selLayer.id,{locked:!selLayer.locked})}>{selLayer.locked?"🔓":"🔒"}</button>
              <button className="btn btn-danger" style={{fontSize:10,flex:1}} onClick={()=>deleteLayer(selLayer.id)}>🗑</button>
            </div>
            {dtfInfo&&(<div className="dtf-box">
              <div className="dtf-box-label">DTF Transfer Size · {d.shirtSize}</div>
              <div className="dtf-box-val">{dtfInfo.w}" × {dtfInfo.h}"</div>
              <div className="dtf-box-sub">max area: {activeMaxW}" × {activeMaxH}"</div>
              {!isSleeveZone&&<>
                <div style={{marginTop:6,height:1,background:"#1e1e1e"}} />
                <div style={{marginTop:5,display:"flex",flexDirection:"column",gap:2}}>
                  <div style={{fontSize:9,color:"rgba(255,180,0,0.7)",fontFamily:"'DM Mono',monospace"}}>↕ {sizeSpec.collarGap % 1 === 0.5 ? sizeSpec.collarGap.toString().replace(".5"," ½") : sizeSpec.collarGap}" from collar seam</div>
                  <div style={{fontSize:9,color:"rgba(100,180,255,0.7)",fontFamily:"'DM Mono',monospace"}}>↕ {sizeSpec.bottomGap}" from bottom of shirt</div>
                </div>
              </>}
            </div>)}
          </div>
        ):(
          <div style={{flex:1,padding:12}}>
            <div style={{fontSize:10,color:"#3a3a3a",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>No Layer Selected</div>
            <div style={{fontSize:11,color:"#333",lineHeight:1.8}}>Upload art using the button above, then click a layer to edit it.</div>
          </div>
        )}
        <div style={{padding:12,borderTop:"1px solid #1e1e1e",display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
          <div className="panel-label" style={{marginBottom:2}}>Download · {zoneInfo?.label.split("–")[1]?.trim()}</div>
          <button className="btn btn-primary" style={{fontSize:11}} onClick={()=>download(true)}>⬇ Design + Shirt</button>
          <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>download(false)}>⬇ Logo Only (PNG)</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
