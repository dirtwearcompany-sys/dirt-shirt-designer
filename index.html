<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dirt Shirt Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0f0f0f; color: #e8e8e8; font-family: 'DM Mono', monospace; overflow: hidden; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .btn { padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #f97316; color: #000; }
    .btn-primary:hover:not(:disabled) { background: #fb923c; }
    .btn-ghost { background: transparent; color: #aaa; border: 1px solid #333; }
    .btn-ghost:hover:not(:disabled) { border-color: #666; color: #eee; }
    .btn-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.27); }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.13); }
    .btn-type { padding: 5px 0; font-size: 11px; border: none; cursor: pointer; border-radius: 6px; flex: 1; font-family: 'DM Mono', monospace; transition: all 0.15s; }
    .zone-tab { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; border: 1px solid transparent; transition: all 0.15s; white-space: nowrap; text-align: left; background: none; width: 100%; color: #888; border-color: #333; font-family: 'DM Mono', monospace; }
    .zone-tab:hover { border-color: #555; color: #ccc; }
    .zone-tab.active { background: #f97316 !important; color: #000 !important; border-color: #f97316 !important; }
    .layer-row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; margin-bottom: 3px; cursor: pointer; border: 1px solid transparent; transition: background 0.1s; }
    .layer-row:hover { background: rgba(255,255,255,0.04); }
    .layer-row.selected { background: rgba(249,115,22,0.09); border-color: rgba(249,115,22,0.27); }
    .design-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; transition: border-color 0.2s; }
    .design-card:hover { border-color: #f97316; }

    /* ── Unified canvas wrapper: all zones render at the same pixel box ── */
    .shirt-stage {
      position: relative;
      width: 420px;
      height: 520px;
      border-radius: 10px;
      overflow: hidden;
      background: transparent;
      box-shadow: 0 0 0 1px #1e1e1e, 0 30px 80px rgba(0,0,0,0.56);
    }

    /* The shirt photo always fills the stage, centered, fully visible */
    .shirt-bg {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .shirt-bg img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      transition: opacity 0.18s ease;
    }

    /* ── BG Eraser Modal ── */
    .bge-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:200; display:flex; flex-direction:column; }
    .bge-toolbar { background:#141414; border-bottom:1px solid #222; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; flex-wrap:wrap; }
    .bge-canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; cursor:none; }
    .bge-footer { background:#141414; border-top:1px solid #222; padding:10px 16px; display:flex; align-items:center; gap:10px; justify-content:flex-end; }
    .bge-cursor { position:fixed; pointer-events:none; border-radius:50%; border:2px solid rgba(255,255,255,0.8); transform:translate(-50%,-50%); z-index:9999; }
    input[type="range"] { accent-color: #f97316; width: 100%; height: 4px; cursor: pointer; }
    input[type="color"] { cursor: pointer; }
    .resize-handle { position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; background: #f97316; border-radius: 2px; cursor: se-resize; z-index: 20; }
    .header { background: #141414; border-bottom: 1px solid #222; padding: 11px 24px; display: flex; align-items: center; gap: 14px; height: 53px; flex-shrink: 0; }
    .logo-dirt  { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #f97316; letter-spacing: 3px; }
    .logo-shirt { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #e8e8e8; letter-spacing: 2px; }
    .logo-des   { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #f97316; letter-spacing: 2px; }
    .logo-sub   { color: #444; font-size: 11px; }
    .left-panel  { width: 218px; background: #141414; border-right: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .right-panel { width: 242px; background: #141414; border-left: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .center-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; position: relative; overflow: hidden; }
    .editor-wrap { display: flex; overflow: hidden; }
    .panel-section { padding: 12px; border-bottom: 1px solid #1e1e1e; }
    .panel-label { font-size: 10px; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .scrollable { flex: 1; overflow-y: auto; padding: 12px; }
    .color-swatch { width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 2px solid #2a2a2a; transition: transform 0.1s; }
    .color-swatch:hover { transform: scale(1.1); }
    .zone-badge { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 16px; font-size: 11px; color: #666; white-space: nowrap; z-index: 20; pointer-events: none; }
    .dtf-badge { margin-top: 14px; background: #161616; border: 1px solid rgba(249,115,22,0.2); border-radius: 8px; padding: 8px 20px; display: flex; gap: 16px; align-items: center; }
    .dtf-label { font-size: 10px; color: #f97316; text-transform: uppercase; letter-spacing: 1px; }
    .dtf-value { font-family: 'Bebas Neue', cursive; font-size: 22px; color: #fff; letter-spacing: 1px; }
    .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; }
    .lib-wrap { padding: 32px; max-width: 1100px; margin: 0 auto; overflow-y: auto; height: 100%; }
    .lib-header { display: flex; align-items: center; margin-bottom: 24px; }
    .lib-title { font-family: 'Bebas Neue', cursive; font-size: 28px; color: #f97316; letter-spacing: 1px; margin: 0; }
    .empty-state { text-align: center; color: #555; padding-top: 80px; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    /* Print-guide and art layers positioned inside the stage */
    .print-guide { position: absolute; left: 15%; top: 14%; width: 70%; height: 72%; border: 1px dashed rgba(255,255,255,0.07); border-radius: 4px; pointer-events: none; z-index: 2; }
    .art-hint { position: absolute; left: 15%; top: 14%; width: 70%; height: 72%; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
    .slider-row { margin-bottom: 10px; }
    .slider-top { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .slider-key { font-size: 10px; color: #666; }
    .slider-val { font-size: 10px; color: #999; }
    .name-display { cursor: text; font-weight: 500; font-size: 13px; color: #e8e8e8; display: flex; align-items: center; gap: 6px; }
    .name-input { width: 100%; background: #222; border: 1px solid #f97316; border-radius: 4px; padding: 4px 8px; color: #fff; font-size: 13px; outline: none; font-family: 'DM Mono', monospace; }
    .dtf-box { margin-top: 14px; background: #0f0f0f; border: 1px solid rgba(249,115,22,0.13); border-radius: 8px; padding: 10px; }
    .dtf-box-label { font-size: 10px; color: #f97316; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .dtf-box-val { font-family: 'Bebas Neue', cursive; font-size: 22px; color: #fff; letter-spacing: 1px; }
    .dtf-box-sub { font-size: 10px; color: #555; margin-top: 2px; }
    .dot-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; margin-left: 6px; }
    /* ── Drawing Modal ── */
    .draw-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .draw-modal { background:#161616; border:1px solid #2a2a2a; border-radius:14px; display:flex; flex-direction:column; overflow:hidden; width:min(900px,95vw); height:min(680px,90vh); box-shadow:0 40px 120px rgba(0,0,0,0.8); }
    .draw-toolbar { background:#111; border-bottom:1px solid #222; padding:8px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex-shrink:0; }
    .draw-tool-btn { padding:5px 10px; border-radius:6px; border:1px solid #333; background:transparent; color:#888; cursor:pointer; font-size:12px; font-family:'DM Mono',monospace; transition:all 0.15s; white-space:nowrap; }
    .draw-tool-btn:hover { border-color:#555; color:#ccc; }
    .draw-tool-btn.active { background:#f97316; color:#000; border-color:#f97316; }
    .draw-canvas-wrap { flex:1; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#0d0d0d; position:relative; }
    .draw-canvas { cursor:crosshair; display:block; touch-action:none; }
    .draw-footer { background:#111; border-top:1px solid #222; padding:10px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0; justify-content:flex-end; }
    /* ── AI Image Generator Modal ── */
    .ai-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:flex; align-items:center; justify-content:center; }
    .ai-modal { background:#161616; border:1px solid #2a2a2a; border-radius:14px; width:min(680px,94vw); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 40px 120px rgba(0,0,0,0.8); }
    .ai-modal-header { background:#111; border-bottom:1px solid #222; padding:14px 18px; display:flex; align-items:center; gap:10px; }
    .ai-modal-body { padding:20px 18px; display:flex; flex-direction:column; gap:14px; }
    .ai-prompt-row { display:flex; gap:8px; }
    .ai-prompt-input { flex:1; background:#111; border:1px solid #333; border-radius:8px; padding:10px 14px; color:#e8e8e8; font-family:'DM Mono',monospace; font-size:13px; outline:none; resize:none; }
    .ai-prompt-input:focus { border-color:#f97316; }
    .ai-preview-area { background:#0d0d0d; border:1px solid #1e1e1e; border-radius:10px; min-height:320px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
    .ai-preview-img { max-width:100%; max-height:360px; display:block; border-radius:8px; }
    .ai-spinner { width:40px; height:40px; border:3px solid #222; border-top-color:#f97316; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .ai-style-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .ai-chip { padding:4px 10px; border-radius:20px; border:1px solid #333; background:transparent; color:#888; font-size:11px; cursor:pointer; font-family:'DM Mono',monospace; transition:all 0.15s; }
    .ai-chip:hover { border-color:#f97316; color:#f97316; }
    .ai-chip.active { background:#f97316; color:#000; border-color:#f97316; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════════════════
// 🖼️  SHIRT IMAGES — REPLACE THE "#" PATHS WITH YOUR OWN IMAGE URLS OR FILE PATHS
//     Example:  short_front: "images/short-front.png"
//               short_front: "https://yoursite.com/shirt-front.jpg"
// ═══════════════════════════════════════════════════════════════════════════════
const SHIRT_IMAGE_SRCS = {
  // ── Short Sleeve ──────────────────────────────────────────
  short_front:  "front_shortsleeve.png",   // Short Sleeve Front
  short_back:   "back_shortsleeve.png",    // Short Sleeve Back
  short_sleeve: "side_shortsleeve.png",    // Short Sleeve Sleeve
  // ── Long Sleeve ───────────────────────────────────────────
  long_front:   "back_longsleeve (1).png", // Long Sleeve Front
  long_back:    "back_longsleeve.png",     // Long Sleeve Back
  long_sleeve:  "side_longsleeve.png",     // Long Sleeve Sleeve
};

// ── BASE COLOR OF EACH SHIRT IMAGE ────────────────────────────────────────────
// Set this to the actual shirt color in your photos so recoloring works
// correctly. Common values: "#ffffff" white, "#c8c8c8" light gray, "#888" gray
const ZONE_BASE_COLOR = {
  short_front:  "#7B3A2A",  // ← short sleeve photos: red-brown
  short_back:   "#7B3A2A",
  short_sleeve: "#7B3A2A",
  long_front:   "#ffffff",  // ← long sleeve photos: white
  long_back:    "#ffffff",
  long_sleeve:  "#ffffff",
};

// ── SHIRT IMAGE POSITION OFFSETS ──────────────────────────────────────────────
// Fine-tune where each shirt sits inside the canvas.
// x: negative = move left,  positive = move right  (% of canvas width)
// y: negative = move up,    positive = move down   (% of canvas height)
// s: scale multiplier — 1.0 = default fit, 1.1 = 10% bigger, 0.9 = 10% smaller
// TIP: Use the live sliders in the app under each zone tab, then copy
//      the values you like back here so they're saved permanently.
const ZONE_OFFSET = {
  short_front:  { x: 0, y: 0, s: 1.0 },
  short_back:   { x: 0, y: 0, s: 1.0 },
  short_sleeve: { x: 0, y: 0, s: 1.0 },
  long_front:   { x: 0, y: 0, s: 1.0 },
  long_back:    { x: 0, y: 0, s: 1.0 },
  long_sleeve:  { x: 0, y: 0, s: 1.0 },
};
// ═══════════════════════════════════════════════════════════════════════════════

// ── One fixed stage size for ALL zones — guarantees identical frame on every switch ──
const STAGE_W = 420;
const STAGE_H = 520;

// Art-layer coordinate space still uses per-zone logical sizes for DTF math,
// but we normalise them to the stage so positions stay consistent.
const ZONE_LOGICAL = {
  short_front:[380,460], short_back:[380,460], short_sleeve:[380,240],
  long_front:[380,510],  long_back:[380,510],  long_sleeve:[250,510],
};

const SHIRT_COLORS = [
  { name:"White",       hex:"#FFFFFF" }, { name:"Black",      hex:"#1a1a1a" },
  { name:"Navy",        hex:"#1B2A4A" }, { name:"Royal Blue", hex:"#2563EB" },
  { name:"Red",         hex:"#DC2626" }, { name:"Forest",     hex:"#166534" },
  { name:"Charcoal",    hex:"#374151" }, { name:"Maroon",     hex:"#7F1D1D" },
  { name:"Gold",        hex:"#D97706" }, { name:"Purple",     hex:"#7C3AED" },
  { name:"Pink",        hex:"#EC4899" }, { name:"Orange",     hex:"#EA580C" },
  { name:"Teal",        hex:"#0D9488" }, { name:"Gray",       hex:"#9CA3AF" },
  { name:"Tan",         hex:"#D4A574" }, { name:"Lt Blue",    hex:"#93C5FD" },
];
const SHIRT_ZONES = {
  short: [
    { id:"short_front",  label:"Short Sleeve – Front",  maxW:12, maxH:14 },
    { id:"short_back",   label:"Short Sleeve – Back",   maxW:12, maxH:14 },
    { id:"short_sleeve", label:"Short Sleeve – Sleeve", maxW:4,  maxH:4  },
  ],
  long: [
    { id:"long_front",  label:"Long Sleeve – Front",  maxW:12, maxH:14 },
    { id:"long_back",   label:"Long Sleeve – Back",   maxW:12, maxH:14 },
    { id:"long_sleeve", label:"Long Sleeve – Sleeve", maxW:4,  maxH:14 },
  ],
};
const ZONE_LABELS = {
  short_front:"Short Sleeve Front", short_back:"Short Sleeve Back", short_sleeve:"Short Sleeve Sleeve",
  long_front:"Long Sleeve Front",   long_back:"Long Sleeve Back",   long_sleeve:"Long Sleeve Sleeve",
};

function calcDTF(pctW, pctH, maxW, maxH) {
  return { w:((pctW/100)*maxW).toFixed(1), h:((pctH/100)*maxH).toFixed(1) };
}

function blankDesign(name="New Design") {
  function srcOrNull(key) { const s = SHIRT_IMAGE_SRCS[key]; return (s && s !== "#") ? s : null; }
  return {
    id: Date.now() + Math.random(),
    name,
    shirtColor: "#FFFFFF",
    shirtType: "short",
    activeZone: "short_front",
    shirtImages: {
      short_front:  srcOrNull("short_front"),
      short_back:   srcOrNull("short_back"),
      short_sleeve: srcOrNull("short_sleeve"),
      long_front:   srcOrNull("long_front"),
      long_back:    srcOrNull("long_back"),
      long_sleeve:  srcOrNull("long_sleeve"),
    },
    zones: { short_front:{layers:[]}, short_back:{layers:[]}, short_sleeve:{layers:[]}, long_front:{layers:[]}, long_back:{layers:[]}, long_sleeve:{layers:[]} },
  };
}

// ─── Color helpers (used by removeBg + download) ─────────────────────────────
function hexToRgb(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function colorDist(r1,g1,b1,r2,g2,b2){ return Math.abs(r1-r2)+Math.abs(g1-g2)+Math.abs(b1-b2); }

// ─── ShirtBackground ─────────────────────────────────────────────────────────
// Renders shirt photo exactly as-is for maximum realism.
function ShirtBackground({ shirtImage, shirtColor, baseColor, offset }) {
  const canvasRef = useRef(null);
  const [naturalImg, setNaturalImg] = useState(null);

  useEffect(() => {
    if (!shirtImage) return;
    const img = new Image();
    img.onload = () => setNaturalImg(img);
    img.src = shirtImage;
  }, [shirtImage]);

  useEffect(() => {
    if (!naturalImg || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    // Always render at fixed stage size so all zones align consistently
    const W = 420, H = 520;
    canvas.width  = W;
    canvas.height = H;
    ctx.clearRect(0, 0, W, H);

    // ── Auto-crop: detect actual shirt content bounds by trimming dark border ──
    // Draw full image to a temp canvas first so we can scan pixels
    const tmp = document.createElement("canvas");
    tmp.width = naturalImg.width; tmp.height = naturalImg.height;
    const tctx = tmp.getContext("2d");
    tctx.drawImage(naturalImg, 0, 0);
    const raw = tctx.getImageData(0, 0, tmp.width, tmp.height);
    const rp = raw.data, RW = tmp.width, RH = tmp.height;

    // Find bounding box of non-background pixels (lum > 0.06 for dark bg)
    let minX=RW, maxX=0, minY=RH, maxY=0;
    // Sample bg lum from corners to decide threshold
    const cornerLum = (0.299*rp[0]+0.587*rp[1]+0.114*rp[2])/255;
    const LUM_THRESH = cornerLum < 0.12 ? 0.06 : 0.94; // dark bg or light bg
    const isLightBg = cornerLum >= 0.12;
    for (let y=0; y<RH; y++) for (let x=0; x<RW; x++) {
      const i=(y*RW+x)*4;
      const lum=(0.299*rp[i]+0.587*rp[i+1]+0.114*rp[i+2])/255;
      const isShirt = isLightBg ? lum < LUM_THRESH : lum > LUM_THRESH;
      if (isShirt) {
        if (x<minX) minX=x; if (x>maxX) maxX=x;
        if (y<minY) minY=y; if (y>maxY) maxY=y;
      }
    }
    // Add small padding (2% of image) so shirt doesn't clip
    const padX = Math.floor(RW * 0.02), padY = Math.floor(RH * 0.02);
    minX = Math.max(0, minX-padX); maxX = Math.min(RW-1, maxX+padX);
    minY = Math.max(0, minY-padY); maxY = Math.min(RH-1, maxY+padY);
    const cropW = maxX - minX + 1, cropH = maxY - minY + 1;

    // Draw cropped shirt into stage canvas, centered with contain scaling
    const scale = Math.min(W / cropW, H / cropH) * 0.96; // 0.96 = slight inset margin
    const dw = cropW * scale, dh = cropH * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    ctx.drawImage(naturalImg, minX, minY, cropW, cropH, dx, dy, dw, dh);

    const data = ctx.getImageData(0, 0, W, H);
    const px = data.data;

    // ── Step 1: Sample border to detect background color & type ─────────
    let sr=0,sg=0,sb=0,sc2=0;
    for (let x=0;x<W;x++) {
      for (const y of [0,H-1]) { const i=(y*W+x)*4; sr+=px[i];sg+=px[i+1];sb+=px[i+2];sc2++; }
    }
    for (let y=1;y<H-1;y++) {
      for (const x of [0,W-1]) { const i=(y*W+x)*4; sr+=px[i];sg+=px[i+1];sb+=px[i+2];sc2++; }
    }
    const bgR=Math.round(sr/sc2), bgG=Math.round(sg/sc2), bgB=Math.round(sb/sc2);
    const bgLum = (0.299*bgR + 0.587*bgG + 0.114*bgB) / 255;
    const isDarkBg = bgLum < 0.12; // true for black backgrounds

    // ── Step 2: Flood-fill from border — bg detection method depends on bg type ──
    // Dark bg: use luminosity threshold (avoids leaking into shirt edges)
    // Light bg: use color-distance threshold
    const isBg = new Uint8Array(W * H);
    const queue = new Int32Array(W * H * 2);
    let qHead=0, qTail=0;
    function seedPx(idx) { if(!isBg[idx]){ isBg[idx]=1; queue[qTail++]=idx; } }
    for (let x=0;x<W;x++) { seedPx(x); seedPx((H-1)*W+x); }
    for (let y=1;y<H-1;y++) { seedPx(y*W); seedPx(y*W+W-1); }

    while (qHead < qTail) {
      const idx=queue[qHead++], x=idx%W, y=(idx/W)|0;
      for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) {
        if (!dx&&!dy) continue;
        const nx=x+dx, ny=y+dy;
        if (nx<0||nx>=W||ny<0||ny>=H) continue;
        const ni=ny*W+nx;
        if (isBg[ni]) continue;
        const np=ni*4;
        const nr=px[np], ng=px[np+1], nb2=px[np+2];
        let isBgPixel = false;
        if (isDarkBg) {
          // For black backgrounds: pixel is bg if it's dark (luminosity-based)
          // Use a tight lum threshold — shirt edge pixels are brighter than pure black bg
          const pixLum = (0.299*nr + 0.587*ng + 0.114*nb2) / 255;
          isBgPixel = pixLum < 0.06;
        } else {
          // For light/colored backgrounds: use color distance from sampled bg
          const dr=nr-bgR, dg=ng-bgG, db=nb2-bgB;
          isBgPixel = Math.sqrt(dr*dr+dg*dg+db*db) < 35;
        }
        if (isBgPixel) { isBg[ni]=1; queue[qTail++]=ni; }
      }
    }

    // ── Step 3: Recolor ALL non-background pixels ─────────────────────────
    // Convert each shirt pixel to grayscale luminosity, normalize against
    // the photo's base shirt color, then multiply by target color.
    // This preserves every wrinkle, shadow, and highlight perfectly.
    const [bR,bG,bB] = hexToRgb(baseColor || "#ffffff");
    const baseLum2 = (0.299*bR + 0.587*bG + 0.114*bB) / 255 || 1;
    const [tR,tG,tB] = hexToRgb(shirtColor || "#ffffff");

    for (let i=0; i<W*H; i++) {
      if (isBg[i]) continue;
      const pi=i*4;
      if (px[pi+3] < 10) continue;
      const lum = (0.299*px[pi] + 0.587*px[pi+1] + 0.114*px[pi+2]) / 255;
      const norm = Math.min(lum / baseLum2, 1.3);
      px[pi]   = Math.min(255, Math.round(tR * norm));
      px[pi+1] = Math.min(255, Math.round(tG * norm));
      px[pi+2] = Math.min(255, Math.round(tB * norm));
    }
    ctx.putImageData(data, 0, 0);
  }, [naturalImg, shirtColor, baseColor]);

  if (!shirtImage) return null;
  const ox = offset?.x || 0;
  const oy = offset?.y || 0;
  const sc2 = offset?.s || 1.0;
  return (
    <div className="shirt-bg">
      <canvas ref={canvasRef}
        style={{
          width:"100%", height:"100%",
          display:"block",
          transform:`translate(${ox}%, ${oy}%) scale(${sc2})`,
          transformOrigin:"center center",
          transition:"transform 0.1s ease",
        }} />
    </div>
  );
}

// Uses Pollinations.ai — completely free, no API key needed.
// Generates images via a simple URL fetch.
const AI_STYLES = [
  { label:"No style",       val:""                          },
  { label:"Sticker",        val:"sticker art, white outline, transparent background" },
  { label:"Vintage",        val:"vintage screen print, distressed, retro"            },
  { label:"Minimalist",     val:"minimalist flat design, simple, clean lines"        },
  { label:"Graffiti",       val:"graffiti street art, bold, urban"                   },
  { label:"Watercolor",     val:"watercolor illustration, soft edges"                },
  { label:"Pixel Art",      val:"pixel art, 8-bit, retro game style"                 },
  { label:"Sketch",         val:"pencil sketch, hand drawn, ink"                     },
  { label:"Neon",           val:"neon glow, dark background, vibrant colors"         },
  { label:"Cartoon",        val:"cartoon illustration, bold outlines, flat color"    },
];
const AI_SIZES = [
  { label:"Square 1:1",   w:512,  h:512  },
  { label:"Wide 16:9",    w:768,  h:432  },
  { label:"Tall 9:16",    w:432,  h:768  },
  { label:"Portrait 3:4", w:512,  h:682  },
];

function AIGeneratorModal({ onClose, onAdd }) {
  const [prompt, setPrompt]     = useState("");
  const [style, setStyle]       = useState("");
  const [size, setSize]         = useState(AI_SIZES[0]);
  const [imgUrl, setImgUrl]     = useState(null);
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState(null);
  const [seed, setSeed]         = useState(()=>Math.floor(Math.random()*99999));

  async function generate() {
    if (!prompt.trim()) return;
    setLoading(true); setError(null); setImgUrl(null);
    try {
      const fullPrompt = [prompt.trim(), style, "dtf transfer design, clean edges"].filter(Boolean).join(", ");
      const encoded = encodeURIComponent(fullPrompt);
      const url = `https://image.pollinations.ai/prompt/${encoded}?width=${size.w}&height=${size.h}&seed=${seed}&nologo=true&model=flux`;
      const dataUrl = await new Promise((res, rej) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          // Draw to canvas to get dataUrl (avoids CORS issues on export)
          const cv = document.createElement("canvas");
          cv.width = img.naturalWidth || size.w;
          cv.height = img.naturalHeight || size.h;
          cv.getContext("2d").drawImage(img, 0, 0);
          res(cv.toDataURL("image/png"));
        };
        img.onerror = () => rej(new Error("Image failed to load"));
        // Small delay so browser doesn't race
        setTimeout(() => { img.src = url; }, 50);
      });
      setImgUrl(dataUrl);
    } catch(e) {
      console.error("AI gen:", e);
      setError("Generation failed — check your internet connection and try again.");
    }
    setLoading(false);
  }

  function reroll() { generate(); }  // Re-run with same prompt for variation

  function addToDesign() {
    if (!imgUrl) return;
    onAdd(imgUrl); onClose();
  }

  // Generate on Enter in prompt box
  function onKeyDown(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); } }

  return (
    <div className="ai-modal-overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="ai-modal">
        {/* Header */}
        <div className="ai-modal-header">
          <span style={{fontFamily:"'Bebas Neue',cursive",fontSize:20,color:"#f97316",letterSpacing:2}}>AI IMAGE GENERATOR</span>
          <span style={{fontSize:11,color:"#444",marginLeft:4}}>powered by Pollinations.ai · free · no key needed</span>
          <button onClick={onClose} style={{marginLeft:"auto",background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
        </div>

        <div className="ai-modal-body">
          {/* Prompt */}
          <div>
            <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Describe your image</div>
            <div className="ai-prompt-row">
              <textarea className="ai-prompt-input" rows={2} placeholder='e.g. "a fierce eagle wearing sunglasses, logo style"'
                value={prompt} onChange={e=>setPrompt(e.target.value)} onKeyDown={onKeyDown} />
              <button className="btn btn-primary" style={{padding:"0 18px",fontSize:13,flexShrink:0}} onClick={generate} disabled={loading||!prompt.trim()}>
                {loading?"⏳":"✨"} {loading?"Generating…":"Generate"}
              </button>
            </div>
          </div>

          {/* Style chips */}
          <div>
            <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Style</div>
            <div className="ai-style-chips">
              {AI_STYLES.map(s=>(
                <button key={s.label} className={`ai-chip${style===s.val?" active":""}`} onClick={()=>setStyle(s.val)}>{s.label}</button>
              ))}
            </div>
          </div>

          {/* Size + seed row */}
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Size</div>
              <div style={{display:"flex",gap:6}}>
                {AI_SIZES.map(s=>(
                  <button key={s.label} className={`ai-chip${size===s?" active":""}`} onClick={()=>setSize(s)}>{s.label}</button>
                ))}
              </div>
            </div>
            <button className="btn btn-ghost" style={{marginLeft:"auto",fontSize:11,padding:"5px 12px"}} onClick={()=>{reroll();}} title="New random seed = different variation">
              🎲 New Variation
            </button>
          </div>

          {/* Preview */}
          <div className="ai-preview-area">
            {loading && <div className="ai-spinner" />}
            {!loading && !imgUrl && !error && (
              <div style={{textAlign:"center",color:"#333"}}>
                <div style={{fontSize:32,marginBottom:8}}>✨</div>
                <div style={{fontSize:12}}>Your image will appear here</div>
              </div>
            )}
            {error && <div style={{color:"#ef4444",fontSize:12,padding:16,textAlign:"center"}}>{error}</div>}
            {imgUrl && !loading && <img src={imgUrl} className="ai-preview-img" alt="AI generated" crossOrigin="anonymous" />}
          </div>
        </div>

        {/* Footer */}
        <div style={{padding:"12px 18px",borderTop:"1px solid #1e1e1e",display:"flex",gap:8,justifyContent:"flex-end",background:"#111"}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          {imgUrl && (
            <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>{reroll();generate();}}>🔄 Regenerate</button>
          )}
          <button className="btn btn-primary" onClick={addToDesign} disabled={!imgUrl||loading}>
            ✅ Add to Design
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── DrawingModal ─────────────────────────────────────────────────────────────
function DrawingModal({ onClose, onAdd, initialImage }) {
  const canvasRef   = useRef(null);
  const overlayRef  = useRef(null);
  const [tool, setTool]         = useState("pen");
  const [color, setColor]       = useState("#ffffff");
  const [fillColor, setFillColor] = useState("#f97316");
  const [useFill, setUseFill]   = useState(false);
  const [size, setSize]         = useState(4);
  const [fontSize, setFontSize] = useState(28);
  const [fontFamily, setFontFamily] = useState("'DM Mono', monospace");
  const [history, setHistory]   = useState([]);
  const drawing = useRef(false);
  const startPt  = useRef({x:0,y:0});
  const snapData = useRef(null);

  const CW = 700, CH = 520;

  // Init: if editing an existing image, draw it onto the canvas first
  useEffect(()=>{
    const ctx = canvasRef.current.getContext("2d");
    ctx.clearRect(0,0,CW,CH);
    if (initialImage) {
      const img = new Image();
      img.onload = () => {
        // Scale image to fit canvas while preserving aspect ratio
        const scale = Math.min(CW / img.width, CH / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        const dx = (CW - dw) / 2, dy = (CH - dh) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
        pushHistory();
      };
      img.src = initialImage;
    } else {
      pushHistory();
    }
  },[]);

  function pushHistory() {
    const ctx = canvasRef.current.getContext("2d");
    setHistory(h => [...h.slice(-20), ctx.getImageData(0,0,CW,CH)]);
  }
  function undo() {
    if (history.length < 2) return;
    const prev = history[history.length-2];
    canvasRef.current.getContext("2d").putImageData(prev,0,0);
    setHistory(h => h.slice(0,-1));
  }
  function clearCanvas() {
    canvasRef.current.getContext("2d").clearRect(0,0,CW,CH);
    pushHistory();
  }

  function getPos(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const scaleX = CW / rect.width, scaleY = CH / rect.height;
    if (e.touches) return { x:(e.touches[0].clientX-rect.left)*scaleX, y:(e.touches[0].clientY-rect.top)*scaleY };
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }

  function applyStroke(ctx) {
    ctx.strokeStyle = color;
    ctx.lineWidth   = size;
    ctx.lineCap     = "round";
    ctx.lineJoin    = "round";
    if (useFill) { ctx.fillStyle = fillColor; }
  }

  function onPointerDown(e) {
    if (tool === "text") { handleTextClick(e); return; }
    drawing.current = true;
    const p = getPos(e);
    startPt.current = p;
    const ctx = canvasRef.current.getContext("2d");
    if (tool === "pen" || tool === "eraser") {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }
    if (["rect","ellipse","line","arrow"].includes(tool)) {
      snapData.current = ctx.getImageData(0,0,CW,CH);
    }
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!drawing.current) return;
    const p = getPos(e);
    const ctx = canvasRef.current.getContext("2d");
    if (tool === "pen") {
      applyStroke(ctx); ctx.lineTo(p.x,p.y); ctx.stroke();
    } else if (tool === "eraser") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineWidth = size * 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.lineTo(p.x,p.y); ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    } else if (["rect","ellipse","line","arrow"].includes(tool)) {
      // Restore snapshot then draw preview
      ctx.putImageData(snapData.current,0,0);
      const {x:sx,y:sy} = startPt.current;
      applyStroke(ctx);
      ctx.beginPath();
      if (tool === "rect") {
        if (useFill) ctx.fillRect(sx,sy,p.x-sx,p.y-sy);
        ctx.strokeRect(sx,sy,p.x-sx,p.y-sy);
      } else if (tool === "ellipse") {
        ctx.ellipse((sx+p.x)/2,(sy+p.y)/2,Math.abs(p.x-sx)/2,Math.abs(p.y-sy)/2,0,0,Math.PI*2);
        if (useFill) ctx.fill(); ctx.stroke();
      } else if (tool === "line") {
        ctx.moveTo(sx,sy); ctx.lineTo(p.x,p.y); ctx.stroke();
      } else if (tool === "arrow") {
        const angle = Math.atan2(p.y-sy,p.x-sx);
        const headLen = Math.max(14, size*3);
        ctx.moveTo(sx,sy); ctx.lineTo(p.x,p.y); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x-headLen*Math.cos(angle-0.4),p.y-headLen*Math.sin(angle-0.4));
        ctx.lineTo(p.x-headLen*Math.cos(angle+0.4),p.y-headLen*Math.sin(angle+0.4));
        ctx.closePath(); ctx.fillStyle=color; ctx.fill();
      }
    }
    e.preventDefault();
  }

  function onPointerUp(e) {
    if (!drawing.current) return;
    drawing.current = false;
    const ctx = canvasRef.current.getContext("2d");
    ctx.globalCompositeOperation = "source-over";
    pushHistory();
    e.preventDefault();
  }

  function handleTextClick(e) {
    const p = getPos(e);
    const text = window.prompt("Enter text:");
    if (!text) return;
    const ctx = canvasRef.current.getContext("2d");
    ctx.font = `${fontSize}px ${fontFamily}`;
    ctx.fillStyle = color;
    ctx.fillText(text, p.x, p.y);
    pushHistory();
  }

  function addToDesign() {
    const data = canvasRef.current.toDataURL("image/png");
    onAdd(data);
    onClose();
  }

  const TOOLS = [
    { id:"pen",     label:"✏️ Pen"     },
    { id:"eraser",  label:"⬜ Eraser"  },
    { id:"line",    label:"╱ Line"    },
    { id:"arrow",   label:"→ Arrow"   },
    { id:"rect",    label:"▭ Rect"    },
    { id:"ellipse", label:"◯ Ellipse" },
    { id:"text",    label:"T Text"    },
  ];
  const FONTS = [
    { label:"Mono",    val:"'DM Mono', monospace"   },
    { label:"Bebas",   val:"'Bebas Neue', cursive"   },
    { label:"Serif",   val:"Georgia, serif"           },
    { label:"Sans",    val:"Arial, sans-serif"        },
  ];

  return (
    <div className="draw-modal-overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="draw-modal">
        {/* Toolbar */}
        <div className="draw-toolbar">
          {/* Tools */}
          {TOOLS.map(t=>(
            <button key={t.id} className={`draw-tool-btn${tool===t.id?" active":""}`} onClick={()=>setTool(t.id)}>{t.label}</button>
          ))}
          <div style={{width:1,height:24,background:"#333",margin:"0 2px"}} />
          {/* Stroke color */}
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <span style={{fontSize:10,color:"#555"}}>Stroke</span>
            <input type="color" value={color} onChange={e=>setColor(e.target.value)}
              style={{width:28,height:24,border:"1px solid #333",borderRadius:4,background:"none",cursor:"pointer"}} />
          </div>
          {/* Fill */}
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <input type="checkbox" checked={useFill} onChange={e=>setUseFill(e.target.checked)}
              style={{accentColor:"#f97316",cursor:"pointer"}} id="fill-chk" />
            <label htmlFor="fill-chk" style={{fontSize:10,color:"#555",cursor:"pointer"}}>Fill</label>
            <input type="color" value={fillColor} onChange={e=>setFillColor(e.target.value)}
              style={{width:28,height:24,border:"1px solid #333",borderRadius:4,background:"none",cursor:"pointer",opacity:useFill?1:0.3}} />
          </div>
          <div style={{width:1,height:24,background:"#333",margin:"0 2px"}} />
          {/* Size */}
          <div style={{display:"flex",alignItems:"center",gap:6,minWidth:100}}>
            <span style={{fontSize:10,color:"#555",whiteSpace:"nowrap"}}>{tool==="text"?"Font":"Size"} {tool==="text"?fontSize:size}px</span>
            <input type="range" min={tool==="text"?10:1} max={tool==="text"?120:40} value={tool==="text"?fontSize:size}
              onChange={e=>tool==="text"?setFontSize(+e.target.value):setSize(+e.target.value)}
              style={{width:70,accentColor:"#f97316"}} />
          </div>
          {/* Font picker (text only) */}
          {tool==="text" && (
            <select value={fontFamily} onChange={e=>setFontFamily(e.target.value)}
              style={{background:"#1a1a1a",border:"1px solid #333",color:"#aaa",borderRadius:6,padding:"4px 8px",fontSize:11,fontFamily:"'DM Mono',monospace",cursor:"pointer"}}>
              {FONTS.map(f=><option key={f.val} value={f.val}>{f.label}</option>)}
            </select>
          )}
          <div style={{marginLeft:"auto",display:"flex",gap:6}}>
            <button className="draw-tool-btn" onClick={undo} title="Undo">↩ Undo</button>
            <button className="draw-tool-btn" onClick={clearCanvas}>🗑 Clear</button>
          </div>
        </div>

        {/* Canvas */}
        <div className="draw-canvas-wrap">
          <canvas ref={canvasRef} width={CW} height={CH} className="draw-canvas"
            style={{maxWidth:"100%",maxHeight:"100%",cursor:tool==="eraser"?"cell":tool==="text"?"text":"crosshair"}}
            onMouseDown={onPointerDown} onMouseMove={onPointerMove} onMouseUp={onPointerUp} onMouseLeave={onPointerUp}
            onTouchStart={onPointerDown} onTouchMove={onPointerMove} onTouchEnd={onPointerUp} />
        </div>

        {/* Footer */}
        <div className="draw-footer">
          <span style={{fontSize:11,color:"#444",marginRight:"auto"}}>
            {initialImage ? "✏️ Editing existing layer — draw on top to modify" : "Click on canvas to start drawing · Click outside to cancel"}
          </span>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={addToDesign}>
            {initialImage ? "💾 Save Changes" : "✅ Add to Design"}
          </button>
        </div>
      </div>
    </div>
  );
}


// ─── BgEraserModal ────────────────────────────────────────────────────────────
// Canva-style manual background eraser — paint to erase or restore pixels
function BgEraserModal({ src, onClose, onSave }) {
  const canvasRef   = useRef(null);
  const displayRef  = useRef(null); // shown canvas (checkerboard bg)
  const [mode, setMode]         = useState("erase");   // "erase" | "restore"
  const [brushSize, setBrushSize] = useState(24);
  const [zoom, setZoom]         = useState(1);
  const [cursorPos, setCursorPos] = useState({x:-999,y:-999});
  const painting    = useRef(false);
  const naturalImg  = useRef(null);
  const CW = useRef(0), CH = useRef(0);

  useEffect(() => {
    const img = new Image();
    img.onload = () => {
      naturalImg.current = img;
      const canvas = canvasRef.current;
      canvas.width  = img.width;
      canvas.height = img.height;
      CW.current = img.width; CH.current = img.height;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, img.width, img.height);
      ctx.drawImage(img, 0, 0);
      renderDisplay();
    };
    img.src = src;
  }, []);

  function renderDisplay() {
    const src = canvasRef.current;
    const dst = displayRef.current;
    if (!src || !dst) return;
    dst.width  = src.width;
    dst.height = src.height;
    const dctx = dst.getContext("2d");
    // Checkerboard background
    const size = Math.max(8, Math.floor(src.width / 60));
    for (let y=0; y<src.height; y+=size) for (let x=0; x<src.width; x+=size) {
      dctx.fillStyle = ((Math.floor(x/size)+Math.floor(y/size))%2===0) ? "#ccc" : "#999";
      dctx.fillRect(x, y, size, size);
    }
    dctx.drawImage(src, 0, 0);
  }

  function getCanvasPos(e) {
    const rect = displayRef.current.getBoundingClientRect();
    const scaleX = CW.current / rect.width;
    const scaleY = CH.current / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }

  function paint(e) {
    if (!painting.current) return;
    const {x, y} = getCanvasPos(e);
    const ctx = canvasRef.current.getContext("2d");
    ctx.globalCompositeOperation = mode==="erase" ? "destination-out" : "source-over";
    if (mode === "restore" && naturalImg.current) {
      // Restore: draw from original image clipped to brush circle
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, brushSize/2, 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(naturalImg.current, 0, 0);
      ctx.restore();
    } else {
      // Erase: paint transparent circle
      ctx.beginPath();
      ctx.arc(x, y, brushSize/2, 0, Math.PI*2);
      ctx.fillStyle = "rgba(0,0,0,1)";
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    renderDisplay();
  }

  function onMouseMove(e) {
    setCursorPos({x: e.clientX, y: e.clientY});
    paint(e);
  }
  function onMouseDown(e) { painting.current=true; paint(e); e.preventDefault(); }
  function onMouseUp()    { painting.current=false; }

  function handleSave() {
    onSave(canvasRef.current.toDataURL("image/png"));
    onClose();
  }

  // Display brush size in canvas pixels scaled to display size
  const displayBrushPx = displayRef.current
    ? brushSize * (displayRef.current.getBoundingClientRect().width / (CW.current||1))
    : brushSize;

  return (
    <div className="bge-overlay">
      {/* Cursor */}
      <div className="bge-cursor" style={{
        left: cursorPos.x, top: cursorPos.y,
        width: displayBrushPx, height: displayBrushPx,
        borderColor: mode==="erase" ? "rgba(255,80,80,0.9)" : "rgba(80,255,80,0.9)",
      }} />

      {/* Toolbar */}
      <div className="bge-toolbar">
        <span style={{fontFamily:"'Bebas Neue',cursive",fontSize:15,color:"#f97316",letterSpacing:2}}>BG ERASER</span>
        <div style={{width:1,height:20,background:"#333"}} />
        {/* Mode toggle */}
        <div style={{display:"flex",gap:4}}>
          {[{val:"erase",label:"🧹 Erase"},{val:"restore",label:"✏️ Restore"}].map(m=>(
            <button key={m.val} className="btn" style={{
              fontSize:11, padding:"5px 10px",
              background: mode===m.val ? "#f97316" : "#222",
              color: mode===m.val ? "#000" : "#888",
              border: "1px solid " + (mode===m.val?"#f97316":"#333"),
            }} onClick={()=>setMode(m.val)}>{m.label}</button>
          ))}
        </div>
        <div style={{width:1,height:20,background:"#333"}} />
        {/* Brush size */}
        <div style={{display:"flex",alignItems:"center",gap:8,minWidth:160}}>
          <span style={{fontSize:11,color:"#666",whiteSpace:"nowrap"}}>Brush {brushSize}px</span>
          <input type="range" min={4} max={120} value={brushSize}
            onChange={e=>setBrushSize(+e.target.value)}
            style={{width:100,accentColor:"#f97316"}} />
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:6}}>
          <span style={{fontSize:10,color:"#444",alignSelf:"center"}}>
            {mode==="erase"?"Paint red to erase":"Paint green to restore"}
          </span>
        </div>
      </div>

      {/* Canvas */}
      <div className="bge-canvas-wrap"
        onMouseMove={onMouseMove} onMouseDown={onMouseDown}
        onMouseUp={onMouseUp} onMouseLeave={onMouseUp}>
        <canvas ref={displayRef}
          style={{
            maxWidth:"95%", maxHeight:"100%",
            imageRendering:"pixelated",
            boxShadow:"0 0 40px rgba(0,0,0,0.8)",
          }} />
        <canvas ref={canvasRef} style={{display:"none"}} />
      </div>

      {/* Footer */}
      <div className="bge-footer">
        <span style={{fontSize:11,color:"#444",marginRight:"auto"}}>
          Paint over areas to erase · Switch to Restore to paint back
        </span>
        <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={handleSave}>✅ Save Changes</button>
      </div>
    </div>
  );
}

function App() {
  const [designs, setDesigns] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [view, setView] = useState("editor");
  function createDesign(name) {
    const d = blankDesign(name || "New Design");
    setDesigns(prev => [d, ...prev]);
    setActiveId(d.id);
    setView("editor");
    return d;
  }
  function saveDesign(updated) { setDesigns(prev => prev.map(d => d.id === updated.id ? updated : d)); setActiveId(updated.id); }
  function duplicateDesign(d) {
    const copy = JSON.parse(JSON.stringify(d));
    copy.id = Date.now() + Math.random();
    copy.name = d.name + " (Copy)";
    setDesigns(prev => [copy, ...prev]); setActiveId(copy.id); setView("editor");
  }
  function deleteDesign(id) {
    setDesigns(prev => prev.filter(d => d.id !== id));
    if (activeId === id) { setActiveId(null); setView("library"); }
  }
  function openDesign(d) { setActiveId(d.id); setView("editor"); }
  useEffect(() => { createDesign("My First Design"); }, []);
  const activeDesign = designs.find(d => d.id === activeId) || null;
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      <div className="header">
        <span className="logo-dirt">DIRT</span>
        <span className="logo-shirt">SHIRT</span>

        <span style={{color:"#2a2a2a",fontSize:20,lineHeight:1,margin:"0 4px"}}>|</span>
        <span className="logo-sub">DTF Transfer Studio</span>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>

      </div>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {view === "library" ? (
          <Library designs={designs} onOpen={openDesign} onDuplicate={duplicateDesign} onDelete={deleteDesign} onNew={() => createDesign()} />

}

// ─── Editor ──────────────────────────────────────────────────────────────────
function Editor({ design, onSave, onDuplicate, onBack }) {
  const [d, setD] = useState(() => JSON.parse(JSON.stringify(design)));
  const [selectedLayer, setSelectedLayer] = useState(null);
  const [bgRemoving, setBgRemoving] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const [nameVal, setNameVal] = useState(d.name);
  const [prevZoneImg, setPrevZoneImg] = useState(null);
  // Per-zone shirt image offsets — initialized from ZONE_OFFSET config, editable live
  const [offsets, setOffsets] = useState(() => JSON.parse(JSON.stringify(ZONE_OFFSET)));
  const [showNudge, setShowNudge] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showDrawing, setShowDrawing] = useState(false);
  const [showBgEraser, setShowBgEraser] = useState(false);
  const [editingLayerId, setEditingLayerId] = useState(null); // layer being edited in drawing board
  const [showAI, setShowAI] = useState(false);
  const stageRef = useRef(null);
  const isDragging = useRef(false);
  const dragStart = useRef({});
  const artFileRef = useRef(null);

  const zone = d.zones[d.activeZone];
  const allZones = [...SHIRT_ZONES.short, ...SHIRT_ZONES.long];
  const zoneInfo = allZones.find(z => z.id === d.activeZone);
  const [lW, lH] = ZONE_LOGICAL[d.activeZone] || [380, 460]; // logical size for DTF math
  const selLayer = zone.layers.find(l => l.id === selectedLayer);
  const dtfInfo = selLayer ? calcDTF(selLayer.w, selLayer.h, zoneInfo?.maxW||12, zoneInfo?.maxH||14) : null;
  const allImagesSet = Object.values(d.shirtImages).every(Boolean);
  const currentShirtImg = d.shirtImages?.[d.activeZone];

  const upd = useCallback(patch => setD(p => ({...p,...patch})), []);
  const updZone = useCallback((zid, patch) => setD(p => ({...p, zones:{...p.zones,[zid]:{...p.zones[zid],...patch}}})), []);
  const updLayer = useCallback((lid, patch) => {
    setD(p => {
      const layers = p.zones[p.activeZone].layers.map(l => l.id===lid ? {...l,...patch} : l);
      return {...p, zones:{...p.zones,[p.activeZone]:{...p.zones[p.activeZone],layers}}};
    });
  }, []);

  const updOffset = useCallback((zid, patch) => setOffsets(o => ({...o, [zid]:{...o[zid],...patch}})), []);

  // Delete selected layer with keyboard
  useEffect(() => {
    function onKeyDown(e) {
      if (!selectedLayer) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        deleteLayer(selectedLayer);
      }
    }
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [selectedLayer]);
  const prevImgRef = useRef(currentShirtImg);
  useEffect(() => {
    if (currentShirtImg !== prevImgRef.current) {
      setPrevZoneImg(prevImgRef.current);
      prevImgRef.current = currentShirtImg;
    }
  }, [currentShirtImg]);

  function setShirtImg(zid, src) { setD(p => ({...p, shirtImages:{...p.shirtImages,[zid]:src}})); }
  function addArtLayer(dataUrl) {
    const img = new Image();
    img.onload = () => {
      const asp = img.width/img.height;
      const w=42, h=w/asp;
      const layer = {id:Date.now()+Math.random(),src:dataUrl,x:29,y:22,w,h,opacity:100,rotation:0,locked:false};
      updZone(d.activeZone, {layers:[...zone.layers, layer]});
      setSelectedLayer(layer.id);
    };
    img.src = dataUrl;
  }
  function handleArtFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => addArtLayer(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value = "";
  }
  async function removeBg() {
    if (!selLayer) return;
    setBgRemoving(true);
    await new Promise(r => setTimeout(r, 10));

    try {
      const srcImg = await new Promise((res,rej) => {
        const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=selLayer.src;
      });

      const W=srcImg.width, H=srcImg.height, N=W*H;
      const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
      const ctx=cv.getContext("2d"); ctx.drawImage(srcImg,0,0);
      const id=ctx.getImageData(0,0,W,H); const px=id.data;

      // ── 1. Sample corners for bg color ───────────────────────────────────
      const cpts=[[0,0],[W-1,0],[0,H-1],[W-1,H-1],[1,1],[W-2,1],[1,H-2],[W-2,H-2]];
      let bgR=0,bgG=0,bgB=0;
      cpts.forEach(([x,y])=>{ const i=(y*W+x)*4; bgR+=px[i]; bgG+=px[i+1]; bgB+=px[i+2]; });
      bgR/=cpts.length; bgG/=cpts.length; bgB/=cpts.length;

      // ── 2. Euclidean distance from bg for every pixel ────────────────────
      const dist=new Float32Array(N);
      for(let i=0;i<N;i++){
        const dr=px[i*4]-bgR, dg=px[i*4+1]-bgG, db=px[i*4+2]-bgB;
        dist[i]=Math.sqrt(dr*dr+dg*dg+db*db);
      }

      // ── 3. Multi-pass flood fill — each pass re-seeds from all prior bg ──
      // This lets later (looser) passes crawl through fringe pixels to reach
      // enclosed background pockets. Still safe: can't cross high-dist subject pixels.
      const isBg=new Uint8Array(N);

      function floodPass(thresh) {
        const q=new Uint32Array(N*2); let qh=0,qt=0;
        function tryAdd(i){
          if(i>=0&&i<N&&!isBg[i]&&dist[i]<=thresh){ isBg[i]=1; q[qt++]=i; }
        }
        // Re-seed from ALL existing bg pixels first (handles enclosed areas)
        for(let i=0;i<N;i++) if(isBg[i]) q[qt++]=i;
        // Seed entire border
        for(let x=0;x<W;x++){
          if(!isBg[x])          { isBg[x]=1;         q[qt++]=x;          }
          if(!isBg[(H-1)*W+x]) { isBg[(H-1)*W+x]=1; q[qt++]=(H-1)*W+x; }
        }
        for(let y=1;y<H-1;y++){
          if(!isBg[y*W])        { isBg[y*W]=1;        q[qt++]=y*W;        }
          if(!isBg[y*W+W-1])    { isBg[y*W+W-1]=1;    q[qt++]=y*W+W-1;   }
        }
        while(qh<qt){
          const idx=q[qh++],x=idx%W,y=(idx/W)|0;
          if(x>0)    tryAdd(idx-1);
          if(x<W-1)  tryAdd(idx+1);
          if(y>0)    tryAdd(idx-W);
          if(y<H-1)  tryAdd(idx+W);
          if(x>0   &&y>0)    tryAdd(idx-W-1);
          if(x<W-1 &&y>0)    tryAdd(idx-W+1);
          if(x>0   &&y<H-1)  tryAdd(idx+W-1);
          if(x<W-1 &&y<H-1)  tryAdd(idx+W+1);
        }
      }

      floodPass(30);   // tight: clear unambiguous bg
      floodPass(60);   // medium: JPEG fringe + anti-alias edges
      floodPass(100);  // loose: soft shadows + compression artifacts

      // ── 4. Apply alpha with soft fringe ──────────────────────────────────
      for(let i=0;i<N;i++){
        if(!isBg[i]) continue;
        const d=dist[i];
        if(d<=40) px[i*4+3]=0;
        else {
          const t=Math.min(1,(d-40)/60);
          px[i*4+3]=Math.round(Math.pow(t,1.5)*255);
        }
      }

      // ── 5. Edge cleanup: fade dark/light fringe on fg edge pixels ────────
      // For each non-bg pixel adjacent to a removed pixel:
      // if it's close to the bg color, fade it proportionally
      const alphaSnap=new Uint8Array(N);
      for(let i=0;i<N;i++) alphaSnap[i]=px[i*4+3];

      for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
        const i=y*W+x;
        if(isBg[i]) continue;
        if(alphaSnap[i]<10) continue;
        const nearBg=isBg[i-1]||isBg[i+1]||isBg[i-W]||isBg[i+W];
        if(!nearBg) continue;
        // Fade fringe: the closer to bg color, the more transparent
        const fringeFactor=Math.max(0, 1-dist[i]/120);
        if(fringeFactor>0) px[i*4+3]=Math.round(alphaSnap[i]*(1-fringeFactor*0.85));
      }

      ctx.putImageData(id,0,0);
      updLayer(selLayer.id,{src:cv.toDataURL("image/png")});

    } catch(err) {
      console.error("removeBg:",err);
      alert("Background removal failed: "+err.message);
    }
    setBgRemoving(false);
  }
  function deleteLayer(id) { updZone(d.activeZone, {layers:zone.layers.filter(l=>l.id!==id)}); if (selectedLayer===id) setSelectedLayer(null); }
  function reorderLayer(id, dir) {
    const layers=[...zone.layers], idx=layers.findIndex(l=>l.id===id), ni=idx+dir;
    if(ni<0||ni>=layers.length) return;
    [layers[idx],layers[ni]]=[layers[ni],layers[idx]];
    updZone(d.activeZone,{layers});
  }
  function layerAt(cx,cy) {
    // Convert stage pixel coords → logical % then back to check hit
    const scaleX = lW/STAGE_W, scaleY = lH/STAGE_H;
    for(let i=zone.layers.length-1;i>=0;i--){
      const l=zone.layers[i];
      const lx=(l.x/100)*STAGE_W, ly=(l.y/100)*STAGE_H;
      const lw=(l.w/100)*STAGE_W, lh=(l.h/100)*STAGE_H;
      if(cx>=lx&&cx<=lx+lw&&cy>=ly&&cy<=ly+lh) return l;
    }
    return null;
  }
  function onMD(e) {
    const rect=stageRef.current.getBoundingClientRect();
    const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    const layer=layerAt(cx,cy);
    if(layer&&!layer.locked){ setSelectedLayer(layer.id); isDragging.current=true; dragStart.current={cx,cy,ox:layer.x,oy:layer.y}; }
    else if(!layer) setSelectedLayer(null);
  }
  function onMM(e) {
    if(!isDragging.current||!selectedLayer) return;
    const rect=stageRef.current.getBoundingClientRect();
    const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    const dx=((cx-dragStart.current.cx)/STAGE_W)*100;
    const dy=((cy-dragStart.current.cy)/STAGE_H)*100;
    updLayer(selectedLayer,{x:Math.max(0,dragStart.current.ox+dx),y:Math.max(0,dragStart.current.oy+dy)});
  }
  function onMU() { isDragging.current=false; }

  async function download(withShirt) {
    const sc=2.5, w=STAGE_W*sc, h=STAGE_H*sc;
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const ctx=cv.getContext("2d");
    ctx.clearRect(0,0,w,h);
    if(withShirt){
      const src=d.shirtImages?.[d.activeZone];
      if(src){
        await new Promise(res=>{
          const img=new Image();
          img.crossOrigin="anonymous";
          img.onload=()=>{
            // Recolor shirt for download using same flood-fill logic as preview
            const tmp=document.createElement("canvas");
            tmp.width=img.width; tmp.height=img.height;
            const tctx=tmp.getContext("2d");
            tctx.drawImage(img,0,0);
            const idata=tctx.getImageData(0,0,tmp.width,tmp.height);
            const ipx=idata.data, IW=tmp.width, IH=tmp.height;
            // Sample border for bg detection
            let sr2=0,sg2=0,sb2=0,sc3=0;
            for(let x=0;x<IW;x++){for(const y of[0,IH-1]){const i=(y*IW+x)*4;sr2+=ipx[i];sg2+=ipx[i+1];sb2+=ipx[i+2];sc3++;}}
            for(let y=1;y<IH-1;y++){for(const x of[0,IW-1]){const i=(y*IW+x)*4;sr2+=ipx[i];sg2+=ipx[i+1];sb2+=ipx[i+2];sc3++;}}
            const ibgR=Math.round(sr2/sc3),ibgG=Math.round(sg2/sc3),ibgB=Math.round(sb2/sc3);
            const ibgLum=(0.299*ibgR+0.587*ibgG+0.114*ibgB)/255;
            const isDark=ibgLum<0.12;
            // Flood fill bg
            const iBg=new Uint8Array(IW*IH), iq=new Int32Array(IW*IH*2);
            let iqH=0,iqT=0;
            function sp(i){if(!iBg[i]){iBg[i]=1;iq[iqT++]=i;}}
            for(let x=0;x<IW;x++){sp(x);sp((IH-1)*IW+x);}
            for(let y=1;y<IH-1;y++){sp(y*IW);sp(y*IW+IW-1);}
            while(iqH<iqT){
              const idx=iq[iqH++],ix=idx%IW,iy=(idx/IW)|0;
              for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
                if(!dx&&!dy)continue;
                const nx=ix+dx,ny=iy+dy;
                if(nx<0||nx>=IW||ny<0||ny>=IH)continue;
                const ni=ny*IW+nx;if(iBg[ni])continue;
                const np=ni*4,nr=ipx[np],ng=ipx[np+1],nb3=ipx[np+2];
                let hit=false;
                if(isDark){const pl=(0.299*nr+0.587*ng+0.114*nb3)/255;hit=pl<0.06;}
                else{const dr=nr-ibgR,dg=ng-ibgG,db=nb3-ibgB;hit=Math.sqrt(dr*dr+dg*dg+db*db)<35;}
                if(hit){iBg[ni]=1;iq[iqT++]=ni;}
              }
            }
            // Recolor shirt pixels
            const [bR2,bG2,bB2]=hexToRgb(ZONE_BASE_COLOR[d.activeZone]||"#ffffff");
            const bLum=(0.299*bR2+0.587*bG2+0.114*bB2)/255||1;
            const [tR2,tG2,tB2]=hexToRgb(d.shirtColor||"#ffffff");
            for(let i=0;i<IW*IH;i++){
              if(iBg[i])continue;
              const pi=i*4;if(ipx[pi+3]<10)continue;
              const lm=(0.299*ipx[pi]+0.587*ipx[pi+1]+0.114*ipx[pi+2])/255;
              const nm=Math.min(lm/bLum,1.3);
              ipx[pi]=Math.min(255,Math.round(tR2*nm));
              ipx[pi+1]=Math.min(255,Math.round(tG2*nm));
              ipx[pi+2]=Math.min(255,Math.round(tB2*nm));
            }
            tctx.putImageData(idata,0,0);
            const scale=Math.min(w/img.width,h/img.height);
            const dw=img.width*scale, dh=img.height*scale;
            ctx.drawImage(tmp,(w-dw)/2,(h-dh)/2,dw,dh);
            res();
          };
          img.src=src;
        });
      } else { ctx.fillStyle="#555"; ctx.fillRect(0,0,w,h); }
    }
    for(const layer of zone.layers){
      await new Promise(res=>{
        const img=new Image();
        img.onload=()=>{
          ctx.globalAlpha=layer.opacity/100;
          const lx=(layer.x/100)*w, ly=(layer.y/100)*h;
          const lw=(layer.w/100)*w, lh=(layer.h/100)*h;
          ctx.save(); ctx.translate(lx+lw/2,ly+lh/2); ctx.rotate((layer.rotation||0)*Math.PI/180);
          ctx.drawImage(img,-lw/2,-lh/2,lw,lh); ctx.restore(); ctx.globalAlpha=1; res();
        };
        img.src=layer.src;
      });
    }
    const a=document.createElement("a");
    a.href=cv.toDataURL("image/png");
    a.download=`${d.name.replace(/\s+/g,"-")}-${d.activeZone}${withShirt?"-with-shirt":"-logo"}.png`;
    a.click();
  }

  return (
    <div style={{display:"flex",height:"calc(100vh - 53px)",overflow:"hidden"}} className="editor-wrap">
      {/* LEFT */}
      <div className="left-panel">
        <div className="panel-section">
          <div className="panel-label">Shirt Type</div>
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            {["short","long"].map(t=>(
              <button key={t} className="btn-type"
                style={{background:d.shirtType===t?"#f97316":"#222",color:d.shirtType===t?"#000":"#888"}}
                onClick={()=>{ upd({shirtType:t,activeZone:t==="short"?"short_front":"long_front"}); setSelectedLayer(null); }}>
                {t==="short"?"Short Sleeve":"Long Sleeve"}
              </button>
            ))}
          </div>
          <div className="panel-label">Zones</div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {SHIRT_ZONES[d.shirtType].map(z=>(
              <button key={z.id} className={`zone-tab${d.activeZone===z.id?" active":""}`}
                onClick={()=>{ upd({activeZone:z.id}); setSelectedLayer(null); }}>
                {z.label.split("–")[1]?.trim()}
                {d.shirtImages?.[z.id]&&<span className="dot-indicator" style={{background:d.activeZone===z.id?"#000":"#f97316"}} />}
              </button>
            ))}
          </div>
        </div>

        {/* ── Shirt Position Nudge ── */}
        <div className="panel-section" style={{paddingBottom:showNudge?10:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setShowNudge(v=>!v)}>
            <span className="panel-label" style={{margin:0}}>Shirt Position</span>
            <span style={{fontSize:10,color:"#555"}}>{showNudge?"▲":"▼"}</span>
          </div>
          {showNudge && (
            <div style={{marginTop:8}}>
              {[
                {key:"x", label:"← → Nudge X", min:-30, max:30, step:0.5},
                {key:"y", label:"↑ ↓ Nudge Y", min:-30, max:30, step:0.5},
                {key:"s", label:"⊞ Scale",      min:0.6, max:1.6, step:0.01},
              ].map(({key,label,min,max,step})=>{
                const val = offsets[d.activeZone]?.[key] ?? (key==="s"?1:0);
                return (
                  <div key={key} className="slider-row">
                    <div className="slider-top">
                      <span className="slider-key">{label}</span>
                      <span className="slider-val">{key==="s"?val.toFixed(2):Math.round(val)}</span>
                    </div>
                    <input type="range" min={min} max={max} step={step} value={val}
                      onChange={e=>updOffset(d.activeZone,{[key]:parseFloat(e.target.value)})} />
                  </div>
                );
              })}
              <button className="btn btn-ghost" style={{width:"100%",fontSize:10,marginTop:4,padding:"5px 0"}}
                onClick={()=>{
                  const lines = Object.keys(ZONE_OFFSET).map(k=>`  ${k.padEnd(13)}: { x: ${(offsets[k]?.x||0).toFixed(1)}, y: ${(offsets[k]?.y||0).toFixed(1)}, s: ${(offsets[k]?.s||1).toFixed(2)} },`).join('\n');
                  navigator.clipboard.writeText(`const ZONE_OFFSET = {\n${lines}\n};`).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
                }}>
                {copied?"✅ Copied!":"📋 Copy config for all zones"}
              </button>
              <button className="btn btn-ghost" style={{width:"100%",fontSize:10,marginTop:4,padding:"5px 0"}}
                onClick={()=>updOffset(d.activeZone,{x:0,y:0,s:1.0})}>
                ↺ Reset this zone
              </button>
            </div>
          )}
        </div>
        <div className="panel-section">
          <div className="panel-label">Shirt Color</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>
            {SHIRT_COLORS.map(c=>(
              <div key={c.hex} title={c.name} className="color-swatch"
                style={{background:c.hex,borderColor:d.shirtColor===c.hex?"#f97316":"#2a2a2a"}}
                onClick={()=>upd({shirtColor:c.hex})} />
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}>
            <span style={{fontSize:10,color:"#555"}}>Custom:</span>
            <input type="color" value={d.shirtColor} onChange={e=>upd({shirtColor:e.target.value})}
              style={{width:32,height:24,border:"1px solid #333",borderRadius:4,background:"none"}} />
          </div>
        </div>
        <div className="scrollable">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span className="panel-label" style={{margin:0}}>Art Layers ({zone.layers.length})</span>
            <button style={{fontSize:10,color:"#f97316",background:"none",border:"none",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}
              onClick={()=>artFileRef.current.click()}>+ Add</button>
          </div>
          {zone.layers.length===0&&<div style={{color:"#3a3a3a",fontSize:11,textAlign:"center",paddingTop:16,lineHeight:1.8}}>No art layers yet.<br/>Upload a logo above.</div>}
          {[...zone.layers].reverse().map((layer,i)=>(
            <div key={layer.id} className={`layer-row${selectedLayer===layer.id?" selected":""}`}
              onClick={()=>setSelectedLayer(layer.id===selectedLayer?null:layer.id)}
              onDoubleClick={()=>{ setSelectedLayer(layer.id); setEditingLayerId(layer.id); setShowDrawing(true); }}
              title="Click to select · Double-click to edit in Drawing Board">
              <div style={{width:28,height:28,borderRadius:4,overflow:"hidden",flexShrink:0,background:"#222"}}>
                <img src={layer.src} style={{width:"100%",height:"100%",objectFit:"cover"}} alt="" />
              </div>
              <span style={{fontSize:11,flex:1,color:"#ccc",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {layer.locked?"🔒 ":""}Layer {zone.layers.length-i}
              </span>
              <button style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:13,padding:0,lineHeight:1}}
                onClick={e=>{e.stopPropagation();deleteLayer(layer.id);}}>✕</button>
            </div>
          ))}
        </div>
      </div>

      {/* CENTER */}
      <div className="center-area" style={{flexDirection:"column"}}>
        {!allImagesSet && <ImgSrcPanel shirtImages={d.shirtImages} onUpload={(zid,src)=>setShirtImg(zid,src)} />}
        {allImagesSet && (
          <>
            <div className="zone-badge">{zoneInfo?.label} · max print {zoneInfo?.maxW}" × {zoneInfo?.maxH}"</div>

            {/* ── Unified fixed-size stage — identical frame on every zone switch ── */}
            <div ref={stageRef} className="shirt-stage"
              style={{cursor:zone.layers.length>0?"crosshair":"default"}}
              onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}>

              {/* Shirt image with smooth cross-fade */}
              <ShirtBackground shirtImage={currentShirtImg} shirtColor={d.shirtColor} baseColor={ZONE_BASE_COLOR[d.activeZone]} offset={offsets[d.activeZone]} />

              {/* Dashed print-area guide */}
              <div className="print-guide" />

              {/* Art layers — coordinates stored as % of stage */}
              {zone.layers.map(layer=>{
                const lx=(layer.x/100)*STAGE_W, ly=(layer.y/100)*STAGE_H;
                const lw=(layer.w/100)*STAGE_W, lh=(layer.h/100)*STAGE_H;
                const isSel=layer.id===selectedLayer;
                return (
                  <div key={layer.id} style={{position:"absolute",left:lx,top:ly,width:lw,height:lh,zIndex:10,
                    opacity:layer.opacity/100,transform:`rotate(${layer.rotation||0}deg)`,transformOrigin:"center center",
                    outline:isSel?"2px solid #f97316":"none",cursor:layer.locked?"not-allowed":"move"}}>
                    <img src={layer.src} style={{width:"100%",height:"100%",objectFit:"contain",display:"block",pointerEvents:"none"}} alt="" draggable={false} />
                    {isSel&&(
                      <div className="resize-handle"
                        onMouseDown={e=>{
                          e.stopPropagation();
                          const sx=e.clientX,sy=e.clientY,sw=layer.w,sh=layer.h;
                          const mv=ev=>updLayer(layer.id,{w:Math.max(5,sw+((ev.clientX-sx)/STAGE_W)*100),h:Math.max(5,sh+((ev.clientY-sy)/STAGE_H)*100)});
                          const up=()=>{window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);};
                          window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up);
                        }} />
                    )}
                  </div>
                );
              })}

            </div>

            {dtfInfo&&selLayer&&(
              <div className="dtf-badge" style={{marginTop:14}}>
                <span className="dtf-label">DTF Transfer Size</span>
                <span className="dtf-value">{dtfInfo.w}" × {dtfInfo.h}"</span>
              </div>
            )}
          </>
        )}
      </div>

      {/* RIGHT */}
      <div className="right-panel">
        <div className="panel-section">
          {editingName ? (
            <input className="name-input" autoFocus value={nameVal}
              onChange={e=>setNameVal(e.target.value)}
              onBlur={()=>{upd({name:nameVal});setEditingName(false);}}
              onKeyDown={e=>e.key==="Enter"&&(upd({name:nameVal}),setEditingName(false))} />
          ) : (
            <div className="name-display" onClick={()=>setEditingName(true)}>
              {d.name} <span style={{color:"#444",fontSize:11}}>✏️</span>
            </div>
          )}
          <div style={{display:"flex",gap:6,marginTop:8}}>
            <button className="btn btn-primary" style={{flex:1,fontSize:10,padding:"6px 0"}} onClick={()=>onSave(d)}>💾 Save</button>
            <button className="btn btn-ghost" style={{fontSize:10,padding:"6px 8px"}} onClick={onDuplicate} title="Duplicate">⧉</button>
            <button className="btn btn-ghost" style={{fontSize:10,padding:"6px 8px"}} onClick={onBack}>← Back</button>
          </div>
        </div>
        <div className="panel-section">
          <div className="panel-label">Upload Art / Logo</div>
          <input ref={artFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleArtFile} />
          <button className="btn btn-primary" style={{width:"100%",padding:"9px 0",fontSize:12,marginBottom:6}} onClick={()=>artFileRef.current.click()}>
            📁 Upload Image
          </button>
          <button className="btn btn-ghost" style={{width:"100%",padding:"9px 0",fontSize:12,marginBottom:6}} onClick={()=>setShowDrawing(true)}>
            ✏️ Open Drawing Board
          </button>
          <button className="btn btn-ghost" style={{width:"100%",padding:"9px 0",fontSize:12,borderColor:"rgba(249,115,22,0.4)",color:"#f97316"}} onClick={()=>setShowAI(true)}>
            ✨ AI Image Generator
          </button>
        </div>
        {showBgEraser && selLayer && (
          <BgEraserModal
            src={selLayer.src}
            onClose={()=>setShowBgEraser(false)}
            onSave={dataUrl=>updLayer(selLayer.id,{src:dataUrl})}
          />
        )}
        {showDrawing && (
          <DrawingModal
            onClose={()=>{ setShowDrawing(false); setEditingLayerId(null); }}
            initialImage={editingLayerId ? zone.layers.find(l=>l.id===editingLayerId)?.src : null}
            onAdd={dataUrl => {
              if (editingLayerId) {
                // Replace existing layer's image with the edited version
                updLayer(editingLayerId, { src: dataUrl });
                setEditingLayerId(null);
              } else {
                addArtLayer(dataUrl);
              }
            }}
          />
        )}
        {showAI && <AIGeneratorModal onClose={()=>setShowAI(false)} onAdd={addArtLayer} />}
        {selLayer ? (
          <div className="scrollable">
            <div className="panel-label">Layer Properties</div>
            <button className="btn btn-primary" style={{width:"100%",marginBottom:6,fontSize:11,padding:"7px 0"}}
              onClick={()=>{ setEditingLayerId(selLayer.id); setShowDrawing(true); }}>
              ✏️ Edit in Drawing Board
            </button>
            <div style={{display:"flex",gap:5,marginBottom:10}}>
              <button className="btn btn-ghost" style={{flex:1,fontSize:10,padding:"7px 0",borderColor:bgRemoving?"#f97316":"#333"}}
                onClick={removeBg} disabled={bgRemoving}>
                {bgRemoving?"⏳ Auto...":"⚡ Auto Remove"}
              </button>
              <button className="btn btn-ghost" style={{flex:1,fontSize:10,padding:"7px 0",borderColor:"rgba(249,115,22,0.4)",color:"#f97316"}}
                onClick={()=>setShowBgEraser(true)} disabled={bgRemoving}>
                🖌️ Manual Erase
              </button>
            </div>
            <Slider label="Width %"    value={selLayer.w}           min={5}    max={100} onChange={v=>updLayer(selLayer.id,{w:v})} />
            <Slider label="Height %"   value={selLayer.h}           min={5}    max={100} onChange={v=>updLayer(selLayer.id,{h:v})} />
            <Slider label="X Position" value={selLayer.x}           min={0}    max={90}  onChange={v=>updLayer(selLayer.id,{x:v})} />
            <Slider label="Y Position" value={selLayer.y}           min={0}    max={90}  onChange={v=>updLayer(selLayer.id,{y:v})} />
            <Slider label="Opacity"    value={selLayer.opacity}     min={0}    max={100} onChange={v=>updLayer(selLayer.id,{opacity:v})} />
            <Slider label="Rotation °" value={selLayer.rotation||0} min={-180} max={180} onChange={v=>updLayer(selLayer.id,{rotation:v})} />
            <div style={{marginTop:10,display:"flex",gap:5,flexWrap:"wrap"}}>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>reorderLayer(selLayer.id,-1)}>⬆ Fwd</button>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>reorderLayer(selLayer.id,1)}>⬇ Back</button>
              <button className="btn btn-ghost" style={{fontSize:10,flex:1}} onClick={()=>updLayer(selLayer.id,{locked:!selLayer.locked})}>
                {selLayer.locked?"🔓":"🔒"}
              </button>
              <button className="btn btn-danger" style={{fontSize:10,flex:1}} onClick={()=>deleteLayer(selLayer.id)}>🗑</button>
            </div>
            {dtfInfo&&(
              <div className="dtf-box">
                <div className="dtf-box-label">DTF Transfer Size</div>
                <div className="dtf-box-val">{dtfInfo.w}" × {dtfInfo.h}"</div>
                <div className="dtf-box-sub">relative to {zoneInfo?.maxW}"×{zoneInfo?.maxH}" max area</div>
              </div>
            )}
          </div>
        ) : (
          <div style={{flex:1,padding:12}}>
            <div style={{fontSize:10,color:"#3a3a3a",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>No Layer Selected</div>
            <div style={{fontSize:11,color:"#333",lineHeight:1.8}}>Upload art using the button above, then click a layer to edit it.</div>
          </div>
        )}
        <div style={{padding:12,borderTop:"1px solid #1e1e1e",display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
          <div className="panel-label" style={{marginBottom:2}}>Download · {zoneInfo?.label.split("–")[1]?.trim()}</div>
          <button className="btn btn-primary" style={{fontSize:11}} onClick={()=>download(true)}>⬇ Design + Shirt</button>
          <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>download(false)}>⬇ Logo Only (PNG)</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
